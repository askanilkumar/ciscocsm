<style>
/* Exam-center console: sticky bar, hub of practice modes, history and weak-area view. */
:root {
  --bg: #f1f5f8; --surface: #ffffff; --fg: #14212b; --muted: #55667a; --line: #d3dde6;
  --accent: #0b6fa4; --accent-fg: #ffffff; --sel-bg: #e2f0f8;
  --ok: #1c7c4d; --ok-bg: #e3f4ea; --bad: #b3321f; --bad-bg: #fbe8e4; --warn: #8f5b00; --warn-bg: #fff1d4;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1720; --surface: #162330; --fg: #e5edf3; --muted: #9bb0c0; --line: #2a3b4a;
    --accent: #52b6e8; --accent-fg: #06222f; --sel-bg: #173547;
    --ok: #62d394; --ok-bg: #143324; --bad: #ff8f7b; --bad-bg: #3b1d18; --warn: #f2bc5e; --warn-bg: #3a2d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1720; --surface: #162330; --fg: #e5edf3; --muted: #9bb0c0; --line: #2a3b4a;
  --accent: #52b6e8; --accent-fg: #06222f; --sel-bg: #173547;
  --ok: #62d394; --ok-bg: #143324; --bad: #ff8f7b; --bad-bg: #3b1d18; --warn: #f2bc5e; --warn-bg: #3a2d10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.5; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 10; }
.wrap { max-width: 1120px; margin: 0 auto; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); margin-inline: calc(50% - 50vw); padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .01em; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.spacer { flex: 1; }
.count { color: var(--muted); font-size: 15px; }
.timer { font-family: var(--font-mono); font-weight: 600; font-size: 22px; padding: 2px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.timer.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); }
.timer.crit { color: var(--bad); background: var(--bad-bg); border-color: var(--bad); }
.prog { height: 4px; background: var(--line); margin-inline: calc(50% - 50vw); }
.prog i { display: block; height: 100%; background: var(--accent); }
.topnav { display: flex; gap: 6px; flex-wrap: wrap; }
.topnav button { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 6px 12px; color: var(--muted); font-weight: 600; }
.topnav button.on { color: var(--fg); border-color: var(--line); background: var(--bg); }
.pill { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); background: var(--bg); white-space: nowrap; }
.pill.ok { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.pill.warn { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }

.page { padding-block: 28px; display: grid; gap: 22px; }
.page h1 { font-size: clamp(28px, 4.6vw, 42px); line-height: 1.1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.page h2 { margin: 0 0 10px; font-size: 19px; }
.eyebrow { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }
.lede { color: var(--muted); max-width: 64ch; margin: 0; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.fact b { display: block; font-family: var(--font-mono); font-size: 28px; font-weight: 600; }
.fact span { color: var(--muted); font-size: 15px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 16px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-family: var(--font-mono); }
.tscroll { overflow-x: auto; }
td.mono { white-space: nowrap; }
ul.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.btn { background: var(--accent); color: var(--accent-fg); border: 1px solid var(--accent); border-radius: 4px; padding: 10px 20px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); filter: none; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 15px; }
.input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 4px; }
.input.err { border-color: var(--bad); }
.note { color: var(--muted); font-size: 14px; }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.mode { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.mode h3 { margin: 0; font-size: 18px; }
.mode p { margin: 0; color: var(--muted); font-size: 15px; }
.mode .row { margin-top: 4px; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding-top: 20px; align-items: start; }
@media (max-width: 880px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.tag { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid var(--line); border-radius: 3px; padding: 2px 8px; background: var(--bg); color: var(--muted); }
.tag.multi { color: var(--accent); border-color: var(--accent); }
.qtext { font-size: 20px; line-height: 1.45; margin: 0 0 18px; font-weight: 600; text-wrap: pretty; }
.opts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; background: var(--surface); }
.opt:hover { border-color: var(--accent); }
.opt.on { background: var(--sel-bg); border-color: var(--accent); }
.opt input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.opt .letter { font-family: var(--font-mono); font-weight: 600; color: var(--muted); width: 1.4em; flex: none; }
.opt span.txt { min-width: 0; overflow-wrap: anywhere; }
.qfoot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.map { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); }
@media (max-width: 880px) { .map { position: static; } }
.map h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.nav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.nav button { font-family: var(--font-mono); font-size: 14px; height: 36px; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; position: relative; }
.nav button.ans { background: var(--sel-bg); border-color: var(--accent); }
.nav button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.nav button.cur { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 12px 0 14px; }
.legend i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--line); border-radius: 2px; vertical-align: -1px; margin-right: 5px; background: var(--bg); }
.legend i.a { background: var(--sel-bg); border-color: var(--accent); }
.legend i.f { background: var(--warn); border-color: var(--warn); border-radius: 50%; }
.confirm h2 { margin: 0 0 8px; }
.confirm p { margin: 0 0 8px; }
.stats3 { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0 18px; }
.stats3 div { border: 1px solid var(--line); border-radius: 5px; padding: 8px 14px; background: var(--bg); }
.stats3 b { font-family: var(--font-mono); font-size: 22px; margin-right: 6px; }

.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: center; }
@media (max-width: 600px) { .hero { grid-template-columns: minmax(0, 1fr); } }
.score { font-family: var(--font-mono); font-weight: 600; font-size: clamp(56px, 12vw, 96px); line-height: 1; }
.verdict { display: inline-block; font-weight: 700; padding: 4px 12px; border-radius: 4px; margin-bottom: 8px; }
.verdict.pass { background: var(--ok-bg); color: var(--ok); }
.verdict.fail { background: var(--warn-bg); color: var(--warn); }
.dom { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 2fr) 70px; gap: 12px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--line); }
.dom:last-child { border-bottom: 0; }
.dom small { color: var(--muted); }
@media (max-width: 600px) { .dom { grid-template-columns: minmax(0, 1fr) 64px; } .dom .barbox { grid-column: 1 / -1; order: 3; } }
.barbox { height: 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.barbox i { display: block; height: 100%; background: var(--accent); }
.barbox i.low { background: var(--warn); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 15px; }
.chip.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.rev { list-style: none; margin: 0; padding: 0; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; min-width: 0; border-left-width: 5px; }
.card.c { border-left-color: var(--ok); }
.card.w { border-left-color: var(--bad); }
.card.u { border-left-color: var(--warn); }
.status { font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; }
.c .status { color: var(--ok); } .w .status { color: var(--bad); } .u .status { color: var(--warn); }
.ropts { display: grid; gap: 8px; list-style: none; margin: 12px 0; padding: 0; }
.ropt { border: 1px solid var(--line); border-radius: 5px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.ropt .txt { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; }
.ropt.ok { background: var(--ok-bg); border-color: var(--ok); }
.ropt.bad { background: var(--bad-bg); border-color: var(--bad); }
.ropt .lab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.ropt.ok .lab { color: var(--ok); } .ropt.bad .lab { color: var(--bad); }
.why { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 12px 14px; font-size: 16px; }
.why b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 4px; }
.trend { width: 100%; height: auto; display: block; }
.trend .ax { stroke: var(--line); }
.trend .tgt { stroke: var(--warn); stroke-dasharray: 4 4; }
.trend .ln { stroke: var(--accent); fill: none; stroke-width: 2.5; }
.trend .dot { fill: var(--accent); }
.trend text { fill: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
</style>
</head>

  "1.1": "CX and customer success fundamentals", "1.2": "Value realization journey", "1.3": "LAER", "1.4": "T+ proactive renewal approach",
  "1.5": "CSM role and Cisco 360 PVI", "1.6": "CS practice maturity", "1.7": "Cross-functional alignment",
  "2.1": "Customer priorities and intent", "2.2": "Business drivers: cost, risk, profitability", "2.3": "Adoption Accountability Plan, RACI", "2.4": "Customer Success Plan elements",

  "3.1": "Barrier lenses: observe, converse, data", "3.2": "People, Process, Technology", "3.3": "Barrier impact on value", "3.4": "Customer health score",

  "4.1": "Journey: pre-sales to renewal readiness", "4.2": "QSR and stakeholders", "4.3": "PXP", "4.4": "LCA and LCA-CS", "4.5": "EAWS consumption", "4.6": "Smart and Virtual Accounts",
  "5.1": "NRR, OTRR, ACV, TCV, TTV, ARR", "5.2": "Enterprise Agreements, True Forward", "5.3": "Expansion signals", "5.4": "Expansion business case", "5.5": "Expansion in the success plan"
};
var SRC = { guide: "Cisco learning guide", blueprint: "Blueprint topic, verify in Cisco training", general: "Practice scenario", original: "Practice question" };

var BANK = [{"id":"S1-01","set":1,"d":1,"t":"Which statement best defines customer success?","o":["A reactive function that resolves incidents and service requests within agreed SLAs","A proactive, outcome-focused discipline that helps customers achieve the business results they bought for and discover additional value along the way","A sales-led program that offers discounts to customers approaching renewal","A marketing activity that raises brand awareness among existing customers"],"a":[1],"e":"Customer success is proactive and anchored in the customer's desired business outcomes (expected value), and it also surfaces benefits the customer did not anticipate (unexpected value). Resolving incidents under SLAs describes support. Renewal discounting is a commercial tactic, and brand awareness is marketing.","src":"original"},{"id":"S1-02","set":1,"d":1,"t":"A customer buys a software-defined WAN to cut circuit costs. During the engagement, usage data shows the analytics features also let the customer shorten new-branch rollouts from six weeks to two. How should the faster branch rollout be classified?","o":["Expected value, because it is a feature of the product","Unexpected value, because the customer did not set it as a goal but still benefited from it","A barrier, because it changes the original scope","A support deliverable, because it came from the analytics module"],"a":[1],"e":"Expected value is what the customer set out to achieve (lower circuit costs). Unexpected value is a benefit the customer did not plan for but realizes, and it strengthens the case for renewal and expansion. Being a product feature does not make a benefit 'expected' by the customer. It is not a barrier or a support deliverable.","src":"original"},{"id":"S1-03","set":1,"d":1,"t":"Which statement correctly differentiates customer success, customer support, and sales?","o":["Support is proactive and outcome-driven, while customer success is reactive and ticket-driven","Sales focuses on adoption, while customer success focuses on closing new logos","Support is typically reactive and issue-driven, customer success is proactive and outcome-driven, and sales primarily acquires new business","All three share the same goals and metrics, so the roles can be merged without any change in approach"],"a":[2],"e":"Support responds to issues, customer success proactively drives outcomes and adoption across the lifecycle, and sales acquires new business. The first option reverses support and success. The second reverses sales and success. The fourth is wrong because the roles have different goals, triggers and metrics.","src":"original"},{"id":"S1-04","set":1,"d":1,"t":"Which TWO trends are key drivers creating the need for customer success?","o":["Subscription and consumption models, where revenue depends on customers continuing to renew","Customers buying outcomes rather than products and expecting vendors to help them realize those outcomes","Customers rarely evaluating alternatives at renewal time","Products becoming so simple that post-sale engagement is no longer needed"],"a":[0,1],"e":"When revenue is recurring, value realized after the sale decides renewal, and customers increasingly expect outcomes, not just products. The other two are false: customers do compare alternatives at renewal, and complex multi-product solutions still need guided adoption.","src":"original"},{"id":"S1-05","set":1,"d":1,"t":"A vendor has 20 strategic accounts that generate 45% of revenue and several thousand small accounts. Which engagement approach is MOST appropriate?","o":["A named, high-touch CSM for each strategic account and a scaled, low-touch or digital program for the long tail","One high-touch CSM per account regardless of size, so every customer is treated the same","No proactive engagement for strategic accounts because they already have executive relationships","Digital-only engagement for strategic accounts and dedicated CSMs for the smallest accounts"],"a":[0],"e":"Engagement models are matched to customer segmentation: high-touch for strategic or high-value accounts and scaled (low-touch or tech-touch) for the long tail. Giving every account a dedicated CSM is not economical. Skipping proactive coverage of strategic accounts is high risk, and the last option inverts the logic of segmentation.","src":"original"},{"id":"S1-06","set":1,"d":1,"t":"Which of the following is a LEADING indicator of churn risk rather than a lagging indicator?","o":["Gross revenue churn for the last quarter","Customer logo churn rate for the last year","A sustained decline in active usage of purchased features","The number of customers that did not renew last quarter"],"a":[2],"e":"Declining usage shows up before a customer decides not to renew, so it lets the CSM act in time. Revenue churn, logo churn and non-renewal counts all report losses that have already happened, which makes them lagging indicators.","src":"original"},{"id":"S1-07","set":1,"d":1,"t":"Which TWO are core objectives of a Customer Success Manager?","o":["Drive adoption and help the customer realize its desired business outcomes","Support retention and growth of the account through renewal and expansion","Own break-fix incident resolution and support SLA performance","Close net-new customer deals for the vendor"],"a":[0,1],"e":"The CSM's role centers on adoption, value realization, and the retention and growth that follow from them. Break-fix resolution belongs to support, and closing net-new deals belongs to sales.","src":"original"},{"id":"S1-08","set":1,"d":1,"t":"A vendor engages customers only when they complain, has no consistent success plans, and tracks results informally in spreadsheets. Which description of the customer success practice fits best?","o":["Early maturity: reactive and ad hoc, with limited process and metrics","Advanced maturity: predictive and driven by data","Optimized maturity: automated playbooks drive all engagement","Mature, because customers are being contacted regularly"],"a":[0],"e":"Complaint-driven contact, no standard success plans and informal tracking are hallmarks of a reactive, ad hoc practice. Advanced and optimized practices are proactive, with defined processes, health scoring, playbooks and data-driven decisions.","src":"original"},{"id":"S1-09","set":1,"d":2,"t":"A CIO's top priority is to avoid regulatory penalties and reduce the chance of a security breach. Which business driver does this MOST directly map to?","o":["Cost","Risk","Profitability","Market share"],"a":[1],"e":"Avoiding penalties and breaches is risk reduction. Cost would be about lowering spend, and profitability about improving margin or revenue growth. Market share is not one of the drivers a CSM maps solutions to in this context, and it does not describe the goal stated.","src":"original"},{"id":"S1-10","set":1,"d":2,"t":"Which THREE elements are commonly found in a customer success plan?","o":["The customer's desired business outcomes","Measurable success criteria and milestones, with owners and dates","Identified barriers and risks, and the actions to address them","The vendor's internal sales commission structure","Competitor pricing sheets","The vendor's internal cost of delivery per engineer-hour"],"a":[0,1,2],"e":"A success plan records what the customer wants to achieve, how success will be measured and when, and what could block it. Commission structures, competitor pricing and vendor delivery costs are internal vendor information and do not belong in a plan shared with the customer.","src":"original"},{"id":"S1-11","set":1,"d":2,"t":"What should a CSM do FIRST when building a success plan for a newly landed customer?","o":["Schedule the first quarterly success review","Understand the customer's business objectives and the outcomes it expects from the purchase","Configure usage dashboards","Prepare the renewal quote"],"a":[1],"e":"Everything in the plan (use cases, metrics, milestones) derives from the customer's business objectives, so they must be understood first. Scheduling reviews, building dashboards and preparing a renewal quote all depend on knowing what success means to the customer.","src":"original"},{"id":"S1-12","set":1,"d":2,"t":"Which success criterion is best written?","o":["Improve the network","Make users happier with collaboration tools","Reduce average resolution time for branch network incidents from 6 hours to 3 hours within two quarters","Deploy as many access points as possible"],"a":[2],"e":"A good criterion is specific, measurable, has a baseline and target, and a deadline. 'Improve the network' and 'make users happier' are vague. 'Deploy as many access points as possible' is an activity with no target and no link to a business result.","src":"original"},{"id":"S1-13","set":1,"d":2,"t":"Which of the following is a business OUTCOME rather than an activity or output?","o":["Installing 500 access points across 40 sites","Completing administrator training for 12 engineers","Cutting new-branch onboarding time from six weeks to two weeks","Opening a support case for each outage"],"a":[2],"e":"An outcome is a measurable change in the customer's business. Installing hardware, completing training and opening cases are activities or outputs. They may contribute to an outcome but are not the result the customer wants.","src":"original"},{"id":"S1-14","set":1,"d":2,"t":"A customer's desired outcome is to improve productivity for hybrid teams. Which use case best supports it?","o":["Adopt secure video and messaging so distributed teams can collaborate without switching tools","Purchase additional hardware spares","Renew the existing support contract early","Move the service desk to a new ticketing tool"],"a":[0],"e":"A use case is a specific way the customer will use the solution to deliver an outcome. Collaboration tooling maps directly to hybrid-team productivity. Spares, an early support renewal and a ticketing change do not link to that outcome.","src":"original"},{"id":"S1-15","set":1,"d":2,"t":"Which stakeholder is BEST positioned to confirm business priorities, approve resources, and help remove organizational obstacles in a success plan?","o":["An end user of the product","The customer's executive sponsor","A vendor support engineer","A channel partner's installer"],"a":[1],"e":"The executive sponsor owns the business outcomes and has the authority to align priorities and resources. End users inform adoption and day-to-day usage but cannot commit resources. Vendor support engineers and partner installers are not decision makers on the customer side.","src":"original"},{"id":"S1-16","set":1,"d":2,"t":"Why should a CSM capture baseline measurements before deployment starts?","o":["To prove the customer selected the right vendor","To quantify improvement against the success criteria later","To set the renewal price","To satisfy a support SLA reporting requirement"],"a":[1],"e":"Without a baseline, there is no way to show how much a metric improved. Baselines are the starting point for measuring value. They do not set pricing and are not primarily a support SLA artifact.","src":"original"},{"id":"S1-17","set":1,"d":2,"t":"How should a CSM treat a success plan after it is agreed with the customer?","o":["As a fixed contract that does not change until renewal","As a living document reviewed regularly and updated as priorities, barriers or results change","As an internal vendor document that is not shared with the customer","As a one-time onboarding checklist closed after go-live"],"a":[1],"e":"Customer priorities and barriers change, so the plan is reviewed regularly (for example at each QSR) and updated. It is a shared document with the customer, and it continues well beyond go-live.","src":"original"},{"id":"S1-18","set":1,"d":2,"t":"A customer lists eight desired outcomes but has limited staff capacity. What should the CSM do?","o":["Start all eight in parallel to show responsiveness","Work with the customer to prioritize by business impact and urgency and focus on the top few first","Pick the outcomes that are easiest for the vendor to deliver","Wait until the customer shortens the list on its own"],"a":[1],"e":"Setting a priority success focus with the customer concentrates limited capacity where the business impact is highest. Starting everything at once dilutes effort. Choosing by vendor convenience ignores customer priorities, and waiting passively delays value.","src":"original"},{"id":"S1-19","set":1,"d":2,"t":"What does 'time to value' measure?","o":["The elapsed time from purchase or kickoff until the customer realizes its first measurable benefit","The time between two quarterly success reviews","The length of the contract term","The average time to close a support case"],"a":[0],"e":"Time to value is how quickly a customer starts getting measurable benefit after buying. A shorter time to value generally means stronger adoption and better renewal prospects. The other options describe cadence, contract length and support metrics.","src":"original"},{"id":"S1-20","set":1,"d":2,"t":"Who should own the actions in a customer success plan?","o":["Only the vendor's CSM","Only the customer","Both parties, with named owners on each side agreed with the customer","Only the account manager"],"a":[2],"e":"Outcomes depend on actions from both sides (for example, customer staffing and vendor enablement). Plans work best when each action has a named owner, agreed with the customer. A plan owned by one party alone tends to stall.","src":"original"},{"id":"S1-21","set":1,"d":3,"t":"Which THREE are typical components of a customer health score?","o":["Product adoption and usage","Customer sentiment (for example survey feedback and executive relationship)","Customer financials (for example payment behavior and contract changes)","The vendor's quarterly stock price","The number of employees at the vendor","The CSM's personal opinion with no supporting data"],"a":[0,1,2],"e":"Health scores combine usage or adoption, sentiment and financial signals (and often support and engagement data). Vendor stock price and headcount say nothing about the customer. A purely personal opinion is not an objective, repeatable component.","src":"original"},{"id":"S1-22","set":1,"d":3,"t":"Why should health score weightings be validated against real renewal and churn outcomes?","o":["To confirm the score reflects what actually predicts retention and to refine it over time","To make the score show green for most accounts","Because weightings are fixed by regulation","To avoid sharing the score with the customer"],"a":[0],"e":"A health score is only useful if it predicts outcomes. Comparing it to actual renewals and churn shows which components matter most so the weights can be adjusted. Tuning to show green defeats the purpose, and no regulation sets the weights.","src":"original"},{"id":"S1-23","set":1,"d":3,"t":"An account shows high product usage, but the executive sponsor has left, survey sentiment has dropped, and the new executive has not met the CSM. What is the BEST interpretation?","o":["The account is healthy because usage is high","The account has emerging risk, so the CSM should rebuild executive alignment and confirm the outcomes still matter","The CSM should wait until renewal to engage the new executive","The account should be dropped from coverage because it is already lost"],"a":[1],"e":"Health is multidimensional. Strong usage can mask risk when sponsorship and sentiment weaken. The right move is early executive re-engagement to confirm priorities and value. Waiting until renewal is too late, and the account is not lost.","src":"original"},{"id":"S1-24","set":1,"d":3,"t":"A customer bought a new platform, but only two staff members know how to operate it and adoption has stalled. What type of barrier is this?","o":["Skills and capability barrier","Pricing barrier","Regulatory barrier","Vendor roadmap barrier"],"a":[0],"e":"Too few people who can operate the platform is a skills and capability gap, which enablement, training and role changes can address. Nothing in the scenario points to price, regulation or roadmap issues.","src":"original"},{"id":"S1-25","set":1,"d":3,"t":"Planned use cases are blocked because the platform cannot integrate with the customer's legacy identity system. Which barrier type is this?","o":["Technical barrier","Organizational barrier","Sentiment barrier","Financial barrier"],"a":[0],"e":"An integration or compatibility problem with existing systems is a technical barrier. It needs technical resolution such as a connector, workaround or architecture change, rather than change management or commercial action.","src":"original"},{"id":"S1-26","set":1,"d":3,"t":"Adoption is slow because two departments are competing for priority and no executive has aligned them on the rollout. This is MOST likely which type of barrier?","o":["Organizational barrier (alignment, sponsorship, change management)","Licensing barrier","Hardware compatibility barrier","Network latency barrier"],"a":[0],"e":"Competing priorities and missing executive alignment are organizational barriers. They are best addressed through sponsorship, governance and change management, not technical or licensing fixes.","src":"original"},{"id":"S1-27","set":1,"d":3,"t":"Which sequence best reflects effective barrier management?","o":["Identify, categorize and prioritize by impact, assign owners and actions, track to resolution, and escalate when needed","Wait for the customer to raise it, log it, and close the item once acknowledged","Prioritize by ease only, assign everything to support, and review at renewal","Escalate everything to executives immediately, then assess the impact"],"a":[0],"e":"Effective barrier management is proactive and structured: find barriers, rank them by business impact, give each an owner and action, follow through, and escalate those that cannot be resolved at working level. The alternatives are passive, misprioritized or indiscriminate.","src":"original"},{"id":"S1-28","set":1,"d":3,"t":"A barrier is caused by a product defect outside the CSM's control. What should the CSM do?","o":["Tell the customer it cannot be solved","Engage the appropriate internal teams through the defined escalation path, quantify the business impact, and keep the customer updated","Quietly remove the affected use case from the success plan","Wait until the next release to mention it"],"a":[1],"e":"The CSM stays accountable for the outcome even when the fix sits elsewhere: escalate through the right path with the business impact quantified and keep the customer informed. Giving up, hiding the problem or waiting erodes trust.","src":"original"},{"id":"S1-29","set":1,"d":3,"t":"After six months, a customer has activated 120 of 1,000 purchased licenses, mostly at one of its five sites. How should the CSM interpret this?","o":["Low adoption that signals risk to value realization and renewal, so identify barriers by site and agree an adoption plan","Strong adoption because some users are active","No action needed because the licenses are already paid for","A support problem to hand to the help desk"],"a":[0],"e":"12% activation after six months, concentrated at one site, points to adoption barriers (skills, process, alignment or technical). Paid licenses that are not used put renewal at risk. This is a customer success issue to diagnose, not a support ticket.","src":"original"},{"id":"S1-30","set":1,"d":3,"t":"Which is a customer-financial signal that could lower a health score?","o":["Repeatedly late invoice payments and a request to reduce licensed quantity","A new executive sponsor joins the project","An increase in daily active users","A positive survey score from end users"],"a":[0],"e":"Payment delays and contraction requests are financial warning signs. A new sponsor is a relationship event (it may matter, but it is not a financial signal). Rising usage and positive survey scores are positive adoption and sentiment signals.","src":"original"},{"id":"S1-31","set":1,"d":4,"t":"What is the PRIMARY purpose of a Quarterly Success Review (QSR)?","o":["Review progress against the success plan's outcomes with customer stakeholders and agree priorities for the next quarter","Present the vendor's latest price list","Resolve open support tickets one by one","Collect signatures for the contract renewal"],"a":[0],"e":"The QSR checks value delivered against the plan, reviews adoption and barriers, and sets direction for the next quarter. It is not a pricing presentation, a ticket triage session or a contract signing.","src":"original"},{"id":"S1-32","set":1,"d":4,"t":"Which THREE topics belong on a QSR agenda?","o":["Progress toward business outcomes and success criteria","Adoption and usage trends, including account health","Status of barriers and the actions to resolve them","Vendor internal reorganizations","A detailed review of the vendor's own financial results","Unrelated competitor news"],"a":[0,1,2],"e":"A QSR keeps the customer's outcomes at the center: results against criteria, adoption and health data, and barriers with their actions. Vendor internal matters and unrelated news do not help the customer assess value.","src":"original"},{"id":"S1-33","set":1,"d":4,"t":"Whom should the CSM aim to have attend a QSR from the customer side?","o":["Only help-desk analysts","Business and executive stakeholders who own the outcomes, plus relevant technical leads","Only procurement staff","No customer attendees, since the QSR is an internal vendor meeting"],"a":[1],"e":"The QSR is a joint review of outcomes, so the people who own the business results need to be present, with technical leads to cover detail. Help-desk-only or procurement-only attendance misses the decision makers on value.","src":"original"},{"id":"S1-34","set":1,"d":4,"t":"Which is a desired OUTCOME of a successful QSR?","o":["An updated success plan with agreed actions, owners and dates, and any renewal or expansion opportunities identified","A new support case for every item discussed","A discount offered for the next quarter","A signed purchase order"],"a":[0],"e":"A QSR should leave both sides aligned: refreshed plan, owned actions and visibility of renewal or expansion needs. Support cases, discounts and purchase orders may happen but are not the purpose or measure of a good QSR.","src":"original"},{"id":"S1-35","set":1,"d":4,"t":"Which preparation is BEST before a QSR?","o":["Review the previous QSR's actions, current usage and health data, and barrier status, and agree the agenda with the customer in advance","Reuse last quarter's generic product deck unchanged","Wait for the customer to bring the data","Cancel the QSR if there were no support tickets"],"a":[0],"e":"Preparation means arriving with the facts: follow-through on past actions, current data, and an agreed agenda. A recycled deck, waiting for the customer, or canceling because tickets are quiet all miss the point of reviewing value.","src":"original"},{"id":"S1-36","set":1,"d":4,"t":"A customer reduces manual provisioning effort by 90% after rollout. How should the CSM capture this moment of success?","o":["Mention it verbally and move on","Document the quantified result against the success criteria, record it in the success plan, and share it with the executive stakeholders","Wait until renewal negotiations to mention it","Log it only as a support closure"],"a":[1],"e":"Capturing wins with numbers tied to the success criteria builds the evidence base for executive reviews, renewal and expansion. Unrecorded or delayed mentions waste that evidence, and a support closure does not represent business value.","src":"original"},{"id":"S1-37","set":1,"d":4,"t":"What is the main benefit of a customer success platform?","o":["Consolidating usage, health, sentiment and tasks so CSMs can spot risk and act systematically","Removing the need for conversations with customers","Automating invoice generation","Hosting the vendor's product for the customer"],"a":[0],"e":"CS platforms bring data together and trigger work (alerts, playbooks, tasks) so CSMs can prioritize. They support conversations and do not replace them, and billing or hosting are not their function.","src":"original"},{"id":"S1-38","set":1,"d":4,"t":"What is a customer success playbook?","o":["A standardized set of steps triggered by a defined situation, such as a health score drop or an approaching renewal","A marketing brochure for new products","A list of competitor weaknesses","The customer's internal operating procedures"],"a":[0],"e":"Playbooks give a consistent, repeatable response to common situations, so quality does not depend on one individual. The other options describe marketing, competitive and customer-internal material.","src":"original"},{"id":"S1-39","set":1,"d":4,"t":"How should a CSM tailor communication to different stakeholders?","o":["Executives get business outcomes and value evidence; practitioners get how-to guidance and operational detail","Everyone gets the same level of technical detail","Executives get raw usage logs; practitioners get ROI slides","Only the primary contact receives updates"],"a":[0],"e":"Executives care about business results and risk. Practitioners need operational help. Sending the wrong content to each audience reduces engagement, and relying on one contact creates single-threaded risk.","src":"original"},{"id":"S1-40","set":1,"d":4,"t":"At a QSR, usage data shows adoption has declined for two consecutive quarters. What is the BEST approach?","o":["Leave the slide out to keep the meeting positive","Present the data openly, explore root causes with the customer, and agree a recovery plan with owners","Attribute the decline to the customer's team","Propose additional licenses immediately"],"a":[1],"e":"Transparency and joint root-cause analysis build trust and move toward a fix. Hiding data, assigning blame or pushing more licenses into a low-adoption account all damage the relationship and ignore the actual problem.","src":"original"},{"id":"S1-41","set":1,"d":5,"t":"In the LAER lifecycle (Land, Adopt, Expand, Renew), which stage primarily focuses on helping the customer onboard and start using purchased solutions to achieve outcomes?","o":["Land","Adopt","Expand","Renew"],"a":[1],"e":"Adopt is where onboarding, enablement and usage happen so that value is realized. Land is the initial purchase and handoff. Expand adds new use cases or scope, and Renew secures the continuation of the relationship.","src":"original"},{"id":"S1-42","set":1,"d":5,"t":"What is the most important content of a handoff from sales to the CSM at the Land stage?","o":["The customer's goals, the use cases sold, key stakeholders, timelines and the success expectations set during the sale","The commission paid to the sales team","Competitor pricing used in the deal","The customer's internal HR structure"],"a":[0],"e":"A good handoff carries forward what the customer was promised and wants, so the CSM does not restart discovery or contradict the sale. Commission, competitor pricing and HR structure do not help deliver outcomes.","src":"original"},{"id":"S1-43","set":1,"d":5,"t":"When should a CSM begin building the case for renewal?","o":["Throughout the lifecycle by continuously demonstrating value, with formal renewal planning well before contract end","Only in the last 30 days of the contract","Only if the customer raises it","After the contract has expired"],"a":[0],"e":"Renewals are earned by value delivered over the whole term. Formal renewal planning should start well ahead of the end date so risks can still be addressed. Leaving it to the last month or later is too late.","src":"original"},{"id":"S1-44","set":1,"d":5,"t":"Which TWO activities help identify expansion opportunities from a success plan?","o":["Reviewing desired outcomes that are not yet fully addressed and new use cases that have surfaced","Identifying other teams or business units that face the same problem the solution already solved","Waiting for a competitor to approach the customer","Adding licenses to hit a vendor quota regardless of need"],"a":[0,1],"e":"Unmet outcomes, new use cases and similar needs elsewhere in the business are grounded in the customer's goals. Waiting for a competitor is passive, and quota-driven licensing ignores customer need and harms trust.","src":"original"},{"id":"S1-45","set":1,"d":5,"t":"After an expansion opportunity has been identified and agreed with the customer, what should the CSM do?","o":["Update the success plan with the new outcome, use case, success criteria and milestones","Delete the existing plan and start over","Leave the plan unchanged and track the opportunity in email","Transfer the account to a new CSM"],"a":[0],"e":"The plan is a living document, and expansion extends it with new outcomes and measures. Deleting it loses history, tracking elsewhere fragments the plan, and reassigning the account has no basis.","src":"original"},{"id":"S1-46","set":1,"d":5,"t":"How should the CSM and the account manager work together on expansion?","o":["The CSM brings value evidence and identified needs, the account manager leads the commercial process, and both stay aligned in what the customer hears","The CSM issues quotes and negotiates pricing alone","The account manager works independently of the CSM","Both contact the customer separately with different messages"],"a":[0],"e":"Expansion works best as a coordinated effort: the CSM's insight into outcomes and adoption supports the account manager's commercial role. Working in isolation or with inconsistent messages confuses the customer.","src":"original"},{"id":"S1-47","set":1,"d":5,"t":"Ninety days before renewal, a customer is using 40% of its licenses and has no executive engagement. What is the BEST action?","o":["Send the renewal quote and wait for a response","Launch an adoption recovery plan, re-engage the executive sponsor with value evidence, and explore right-sizing options","Offer a large discount without discussing value","Postpone any action until the last month"],"a":[1],"e":"There is still time to improve adoption and re-establish sponsorship, and right-sizing may protect the relationship. Waiting, discounting without value, or delaying lets the risk grow.","src":"original"},{"id":"S1-48","set":1,"d":5,"t":"Why should a CSM monitor consumption against entitlement in a consumption-based subscription?","o":["To spot under-consumption that risks renewal and over-consumption that signals an expansion need","To bill the customer for overages","To restrict how much the customer can use","To replace the support contract"],"a":[0],"e":"The gap between what is purchased and what is consumed shows both risk and opportunity. The CSM's goal is value realization, not billing or restriction, and consumption monitoring does not replace support.","src":"original"},{"id":"S1-49","set":1,"d":5,"t":"A customer cohort started the year with $1,000,000 in ARR. During the year it added $150,000 in expansion, lost $50,000 through downgrades (contraction), and lost $100,000 through cancellations (churn). What is net revenue retention (NRR)?","o":["85%","100%","115%","90%"],"a":[1],"e":"NRR = (starting ARR + expansion - contraction - churn) / starting ARR = (1,000,000 + 150,000 - 50,000 - 100,000) / 1,000,000 = 100%. The 85% figure is gross revenue retention, which excludes expansion. The other values do not follow from the numbers.","src":"original"},{"id":"S1-50","set":1,"d":5,"t":"A customer did not renew. What should the CSM do afterward?","o":["Run a structured post-mortem on root causes and feed the lessons into health scoring, playbooks and product feedback","Close the file without further review","Blame the sales team","Delete the customer's record immediately"],"a":[0],"e":"Churn analysis turns a loss into learning: confirm the real reasons, check whether health signals caught it, and improve playbooks and product input. Closing the file loses the lesson, and blame or deleting records helps nobody.","src":"original"},{"id":"S2-01","set":2,"d":1,"t":"A vendor's support team reports 98% SLA attainment and a 4.7/5 CSAT. Even so, three strategic accounts decline to renew, citing 'no clear business value.' Which conclusion is MOST accurate?","o":["Support metrics show responsiveness to issues, not whether customers reached their intended outcomes","The SLA targets were too lenient, and tightening them would have prevented these three non-renewals","CSAT is unreliable and should be dropped from strategic account reviews in favor of ticket volume","The accounts were over-served by support, and moving them to a pooled team would have kept them"],"a":[0],"e":"SLA attainment and CSAT describe how well issues are handled. Renewal decisions rest on whether the customer achieved the outcomes it bought for, which needs separate outcome tracking. Tighter SLAs, dropping CSAT or pooling the accounts do not address the missing value evidence.","src":"original"},{"id":"S2-02","set":2,"d":1,"t":"A vendor wants evidence that its customer success program creates value for the vendor's own business. Which measure is the STRONGEST evidence?","o":["Number of quarterly success reviews held across the managed customer base this year","Net revenue retention of managed accounts versus a comparable unmanaged group","Number of customer success plans created and approved by customers in the period","Average number of customer meetings per CSM, trended over the last four quarters"],"a":[1],"e":"Comparing net revenue retention of managed versus comparable unmanaged accounts links the program to revenue results. QSRs held, plans created and meeting counts measure activity, which can rise while outcomes do not.","src":"original"},{"id":"S2-03","set":2,"d":1,"t":"Which TWO statements correctly describe the relationship between customer experience (CX) and customer success (CS)?","o":["CX is the sum of customer perceptions across every interaction, including sales, product and support","CS is a deliberate, proactive practice that contributes to CX by driving adoption and business outcomes","CX is owned by the CSM alone, because the CSM is the only role with ongoing customer contact","CS covers only post-sale ticket handling, which is why it sits outside the wider CX picture"],"a":[0,1],"e":"CX spans the whole journey and every function that touches the customer. CS is one proactive, outcome-focused contributor to it. CX is not owned by one role, and CS is not ticket handling (that is support).","src":"original"},{"id":"S2-04","set":2,"d":1,"t":"A vendor has defined success plans, uses health scores to trigger playbooks, and runs QSRs consistently. It still cannot forecast churn reliably or quantify the financial impact of its CS team. Which description fits this practice BEST?","o":["Ad hoc and reactive, because churn is still not forecast reliably and revenue impact is unknown","Process-defined, with predictive analytics and financial impact measurement as the next step","Fully optimized, because every account has a plan, a health score, a playbook and a review cadence","Not yet started, because no formal revenue attribution exists for the CS team and its programs"],"a":[1],"e":"Defined plans, scoring, playbooks and cadence show an established, repeatable process. Reliable forecasting and financial attribution are the capabilities that distinguish the next level. Ad hoc describes informal work with no standard process, and fully optimized practices are predictive and tied to financial results.","src":"original"},{"id":"S2-05","set":2,"d":1,"t":"A vendor has 3,500 customers. About 40 are strategic accounts with dedicated CSMs. A group of roughly 400 mid-tier accounts has moderate ARR and moderate complexity. Which coverage model is MOST appropriate for the mid-tier group?","o":["A named high-touch CSM for each account, funded by reducing coverage of the strategic group","Reactive support only, with outreach when the customer opens a case or requests a meeting","A pooled CSM team with scheduled check-ins and digital programs, escalating on risk","Partner-led coverage only, with no vendor visibility into usage, health or outcomes at these accounts"],"a":[2],"e":"Segmentation matches effort to account value and risk. Mid-tier accounts suit a pooled or scaled model with defined triggers that escalate to high-touch. One CSM per account is uneconomical, reactive-only coverage misses risk, and partner-only coverage removes the vendor's view of outcomes.","src":"original"},{"id":"S2-06","set":2,"d":1,"t":"Which TWO of the following are LEADING indicators of customer risk?","o":["A decline in weekly active users on the purchased platform over six weeks","Gross revenue churn reported for the most recently closed quarter","Slipping dates on onboarding milestones agreed in the success plan","The renewal rate calculated for the previous fiscal year"],"a":[0,2],"e":"Falling active use and slipping milestones appear while there is still time to act. Gross revenue churn and the prior-year renewal rate report results that have already happened, so they are lagging indicators.","src":"original"},{"id":"S2-07","set":2,"d":1,"t":"Which statement best expresses the value of customer success from the CUSTOMER's point of view?","o":["It lowers the list price of the solution in return for committing to a longer contract term","It places the customer's cases ahead of other customers' cases in the support queue","It speeds time to value and raises confidence the investment will pay off","It transfers responsibility for deployment and operations from the customer to the vendor"],"a":[2],"e":"For the customer, success management means getting to measurable value sooner and with less risk. Price reductions, queue priority and handing over operations are not what the discipline provides.","src":"original"},{"id":"S2-08","set":2,"d":1,"t":"Which of the following is LEAST aligned with the role of a Customer Success Manager?","o":["Owning the final commercial negotiation and pricing of the renewal contract","Helping the customer define and track the outcomes it expects from the solution","Identifying adoption barriers and coordinating the actions needed to remove them","Surfacing expansion needs to the account manager based on the customer's goals"],"a":[0],"e":"The account manager leads commercial negotiation and pricing. The CSM drives outcomes, adoption and barrier removal, and feeds renewal and expansion opportunities to the commercial owner.","src":"original"},{"id":"S2-09","set":2,"d":2,"t":"At kickoff, the customer's CIO says, 'Our goal is to be more agile.' What should the CSM do NEXT?","o":["Record 'be more agile' as the outcome and begin mapping product features to it","Ask what agility means in business terms, then agree a measure and a target","Ask for the customer's budget for the next fiscal year so the scope can be sized","Propose a standard agility use-case bundle and move straight to scheduling training"],"a":[1],"e":"A statement of intent must be turned into a measurable outcome (for example release cycle time or time to provision) with a baseline and a target before use cases are chosen. Mapping features, sizing budget or scheduling training first builds on an undefined goal.","src":"original"},{"id":"S2-10","set":2,"d":2,"t":"A board has told a customer to cut operating expenses by 15% within 18 months. The customer has purchased a bundle that includes automation, segmentation security and a service-launch accelerator. Which capability should the CSM prioritize for the FIRST use case?","o":["Segmentation security to lower the likelihood of a breach, which maps to the risk driver","The service-launch accelerator to bring new revenue-generating services to market sooner","Automation that cuts manual operations effort and consolidates tools, mapping to cost","Whichever capability has the most licenses purchased, so utilization improves fastest"],"a":[2],"e":"The stated driver is cost reduction, so the first use case should be the capability that reduces spend. Risk and profitability are valid drivers for other conversations but are not the board's current priority. License count says nothing about the customer's goal.","src":"original"},{"id":"S2-11","set":2,"d":2,"t":"Which TWO of the following are business OUTCOMES rather than outputs or activities?","o":["Mean time to restore service reduced from 4 hours to 90 minutes","200 access switches installed across 35 branch locations","Audit preparation effort for the security team reduced by 40%","Three administrator workshops delivered to the operations team"],"a":[0,2],"e":"Outcomes are measurable changes in the customer's business. Installing switches and delivering workshops are outputs or activities that may contribute to an outcome but do not demonstrate one.","src":"original"},{"id":"S2-12","set":2,"d":2,"t":"Which sequence BEST reflects the logical order for building a customer success plan?","o":["Milestones and owners, use cases, outcomes, success criteria, then barriers and risks","Outcomes, use cases, success criteria and baselines, milestones and owners, then risks","Use cases, product configuration, outcomes, renewal date, then success criteria and baselines","Barriers and risks, renewal terms, milestones, outcomes, then use cases and success criteria"],"a":[1],"e":"The plan flows from why (outcomes) to how (use cases), then measurement (criteria and baselines), then execution (milestones and owners), then what could go wrong. Starting with tasks or product settings reverses the logic.","src":"original"},{"id":"S2-13","set":2,"d":2,"t":"Three months into a deployment, a CSM finds that no baseline was captured for the key success metric. What is the BEST action?","o":["Reconstruct a baseline from historical records, and agree the method and its limits with the customer","Drop the metric from the plan, since improvement can no longer be demonstrated to the executive team","Use an industry benchmark as the baseline and present the gap to it as proven improvement for the customer","Postpone the next QSR until the customer produces a complete and perfectly accurate baseline"],"a":[0],"e":"A reasonable, jointly agreed reconstruction keeps the outcome measurable. Dropping the metric abandons the customer's goal. A benchmark is not the customer's own starting point, and delaying the review stalls the plan.","src":"original"},{"id":"S2-14","set":2,"d":2,"t":"A success plan names a single customer contact, a network engineer who is also the project champion. Which risk is MOST significant, and what is the BEST mitigation?","o":["Single-threaded dependency; add an executive sponsor and a second operational owner to the plan","Over-engagement; reduce meeting frequency so the engineer is not overloaded with plan reviews","Scope creep; freeze the plan so the engineer cannot add outcomes without vendor approval","Data quality; ask the engineer to sign off on every usage report before it is shared more widely"],"a":[0],"e":"If the only named contact leaves, changes role or lacks authority, the plan loses direction and sponsorship. Adding an executive sponsor and a second owner reduces that dependency. The other options address problems the scenario does not describe.","src":"original"},{"id":"S2-15","set":2,"d":2,"t":"A customer lists five desired outcomes. Which one should be the PRIORITY success focus?","o":["Outcome A: highest business impact, but depends on a customer ERP project not due for 12 months","Outcome B: moderate impact, achievable in two quarters, no dependencies, named by the executive sponsor","Outcome C: low impact and simple to deliver, with the quickest possible technical completion","Outcome D: high impact and high effort, with a delivery date set by the vendor's product roadmap"],"a":[1],"e":"A priority focus balances impact, achievability and executive support. Outcome B can show value soon and has sponsor backing. Outcome A is blocked by a long dependency, C adds little value, and D depends on a date the customer does not control.","src":"original"},{"id":"S2-16","set":2,"d":2,"t":"A contract is signed on 15 January. Kickoff happens on 1 February, and the first measurable benefit is confirmed on 12 April (same year, not a leap year). If time to value is measured from contract signature to first measurable benefit, what is it?","o":["70 days","87 days","97 days","101 days"],"a":[1],"e":"15 January to 12 April is 16 + 28 + 31 + 12 = 87 days. The 70-day figure measures from the 1 February kickoff instead of from signature.","src":"original"},{"id":"S2-17","set":2,"d":2,"t":"Which statement BEST distinguishes a customer success plan from a project plan?","o":["A success plan lists implementation tasks and dates, while a project plan lists the customer's business goals","A success plan is owned by the vendor, while a project plan is owned by the customer and its sponsor","A success plan is built around outcomes across the lifecycle, while a project plan covers delivery tasks","A success plan ends at go-live and handoff, while a project plan continues through renewal and expansion"],"a":[2],"e":"A success plan centers on business outcomes and value realization across the lifecycle. A project plan manages tasks and deliverables for a defined scope. The other options reverse the roles or misstate ownership and duration.","src":"original"},{"id":"S2-18","set":2,"d":2,"t":"A partner is delivering the implementation for the customer. How should the success plan treat the partner's work?","o":["Leave it out, since the partner's contract is separate from the vendor's relationship with the customer","Include the partner's actions with named owners, and keep the CSM tracking the outcomes","Make the partner solely accountable for the customer's outcomes after the deployment is complete","Replace the customer's actions with the partner's actions so the customer has fewer obligations"],"a":[1],"e":"Outcomes depend on all parties who contribute, so partner actions belong in the plan with named owners, and the CSM stays responsible for tracking toward outcomes. Excluding the partner hides dependencies. Customer actions cannot be replaced by partner actions.","src":"original"},{"id":"S2-19","set":2,"d":2,"t":"Which TWO criteria are best for choosing the FIRST use case to adopt?","o":["It delivers value the executive sponsor will notice within a short period","It has few dependencies on other customer projects or teams","It is the most technically complex, so the hardest problems are solved early","It reaches the largest number of users, whether or not they are ready to adopt"],"a":[0,1],"e":"A good first use case is a visible, achievable win with low dependency risk, which builds momentum and sponsor confidence. Starting with the most complex or the widest rollout increases risk of delay.","src":"original"},{"id":"S2-20","set":2,"d":2,"t":"Which event MOST clearly warrants an out-of-cycle update to the success plan?","o":["The vendor releases a minor software patch with no change to the customer's use cases","The customer announces an acquisition that changes its priorities and organization","A support case opened by the customer's operations team is closed within SLA","The CSM's internal quarterly target is adjusted by the vendor's customer success leadership"],"a":[1],"e":"A change in the customer's priorities or structure can change outcomes, owners and sequencing, so the plan must be revisited at once. A minor patch, a closed case or an internal vendor target does not change what the customer is trying to achieve.","src":"original"},{"id":"S2-21","set":2,"d":3,"t":"A health score weights usage at 40%, sentiment at 30% and financials at 30%. An account scores 50 for usage, 90 for sentiment and 80 for financials (each on a 0-100 scale). The bands are green 80 and above, yellow 60-79, red below 60. What is the account's weighted score and band?","o":["71, yellow","73, yellow","75, yellow","71, green"],"a":[0],"e":"(50 x 0.4) + (90 x 0.3) + (80 x 0.3) = 20 + 27 + 24 = 71, which is yellow. 73 is the simple average and ignores the weights. 75 comes from swapping the usage and sentiment weights. Green requires 80 or above.","src":"original"},{"id":"S2-22","set":2,"d":3,"t":"A vendor's health scores show 85% of accounts green, yet only 78% of accounts renew. What is the MOST likely explanation?","o":["The renewal process is flawed, because healthy accounts should renew at the same rate they score green","The score leans on activity such as logins and has not been validated against renewals","Green thresholds are set too high, and lowering them would make the score predict churn accurately","The accounts that did not renew were never scored, which accounts fully for the gap"],"a":[1],"e":"A score that over-weights activity (logins, seats) can look healthy while customers do not realize value. It should be back-tested against actual renewals and adjusted. Changing thresholds alone does not fix what the score measures.","src":"original"},{"id":"S2-23","set":2,"d":3,"t":"Which TWO actions will MOST improve the predictive value of a health score?","o":["Back-test the score against past renewals and churn, then adjust weights to match what predicted outcomes","Remove sentiment from the model because survey responses are subjective and vary between respondents","Include progress against success-plan outcomes alongside usage, so value realization is represented","Add as many data points as the platform can ingest, so no signal is left out of the model"],"a":[0,2],"e":"Back-testing shows which inputs predict outcomes, and including outcome progress represents value realization. Removing sentiment loses an early warning signal, and adding every available data point adds noise.","src":"original"},{"id":"S2-24","set":2,"d":3,"t":"A customer's third-party risk assessment of the new platform has not been completed, so the security team will not approve production use. Three planned use cases are blocked. How should this barrier be classified?","o":["Technical, because the platform has a defect that stops production deployment","Skills, because the security team lacks training on the platform's features","Organizational and process, because a customer governance step is gating deployment","Commercial, because the customer is negotiating price before approving production use"],"a":[2],"e":"An approval step that sits in the customer's governance or compliance process is an organizational or process barrier. Resolving it needs engagement with the customer's security and risk owners, not a fix to the product.","src":"original"},{"id":"S2-25","set":2,"d":3,"t":"A customer has three open barriers. A: blocks the top-priority outcome and needs a decision from the customer's CIO (two-week effort). B: blocks the same outcome and needs a three-month vendor engineering fix. C: affects a low-priority use case and can be cleared in a day. What is the BEST approach?","o":["Clear C first, because quick wins build momentum and reduce the open barrier count","Work A now and escalate B in parallel, because B has the longest lead time","Wait until B is resolved, since A cannot deliver value on its own until the fix lands","Raise all three at the next QSR so the customer can decide the order in a single meeting"],"a":[1],"e":"Both A and B block the priority outcome. A can move quickly, and B's long lead time means escalation must start now. Clearing C first helps a low-priority use case only, and waiting for the next QSR delays both critical items.","src":"original"},{"id":"S2-26","set":2,"d":3,"t":"A customer has stopped attending monthly check-in calls, though platform usage remains stable. What is the BEST interpretation and action?","o":["Stable usage proves the account is healthy, so the monthly calls can be dropped from the cadence","Disengagement is an early risk signal; reach out through other contacts, such as the sponsor","Send the renewal quote early so the customer has more time to review the commercial terms","Escalate to the customer's CEO immediately to ask why the monthly meetings were abandoned"],"a":[1],"e":"Stable usage can mask weakening engagement and sponsorship. A proportionate response is to re-engage through other stakeholders and confirm priorities still hold. A quote does not address the cause, and a CEO escalation is out of proportion.","src":"original"},{"id":"S2-27","set":2,"d":3,"t":"Survey results show a group of users has become detractors, yet adoption metrics for the same group are rising. What should the CSM do?","o":["Treat adoption as the real signal and set the survey result aside as statistical noise for now","Investigate with those users to find the cause, such as usability or training, and close the loop","Remove the group from the next survey so the overall sentiment score is not distorted by a small group","Offer the group an incentive to raise their scores before the next survey cycle begins"],"a":[1],"e":"Rising usage with falling sentiment can mean people are forced to use something they find hard, which is a risk. The right step is to find the root cause with the users and show the customer the problem is being addressed. Ignoring, excluding or incentivizing responses hides the signal.","src":"original"},{"id":"S2-28","set":2,"d":3,"t":"Two customer sites received the same licenses and the same training. Site A reaches 70% adoption of the new workflow and Site B only 20%. Site B's manager has not required the workflow. What is the MOST likely barrier?","o":["Technical, because Site B's hardware must be incompatible with the platform","Organizational, because Site B has no leadership mandate or change management","Commercial, because Site B has not been charged for the licenses it received","Product, because the platform performs differently in different geographies"],"a":[1],"e":"With identical entitlement and training, the difference points to leadership and change management: Site B's manager has not made the workflow expected. The fix is sponsorship and process change at Site B, not a technical or commercial action.","src":"original"},{"id":"S2-29","set":2,"d":3,"t":"When is it MOST appropriate to escalate a barrier to the customer's executive sponsor?","o":["When working-level owners cannot resolve it in the agreed time and it threatens a priority outcome","As soon as any barrier is logged, so the sponsor is aware of every issue in the plan","Only at the next QSR, regardless of how much the barrier delays a milestone before then","Never, because a CSM should resolve every barrier without involving the customer's executives"],"a":[0],"e":"Escalation is for barriers that working-level owners cannot clear in time and that put a priority outcome at risk. Escalating everything dilutes the sponsor's attention, and waiting for a QSR or avoiding executives lets risk grow.","src":"original"},{"id":"S2-30","set":2,"d":3,"t":"A customer announces a hiring freeze and layoffs in the department that uses the solution. What is the BEST first step for the CSM?","o":["Pause all engagement until the customer's reorganization is complete and the dust has settled","Assess the effect on adoption and renewal scope, and re-baseline the plan around the remaining team","Propose additional modules to the customer so the department has more tools to cover the gap","Remind the customer of its contractual commitment and the notice period for any reduction"],"a":[1],"e":"A reduction in staff changes who can adopt, who owns actions and likely the renewal scope. The CSM should assess it and adjust the plan, perhaps focusing on automation outcomes that offset the lost capacity. Pausing, upselling or quoting the contract ignores the customer's situation.","src":"original"},{"id":"S2-31","set":2,"d":4,"t":"Which statement BEST distinguishes a Quarterly Success Review from an operational service review?","o":["The QSR focuses on incidents and SLA statistics, while the service review covers business outcomes","The QSR is outcome-focused with business stakeholders; a service review covers incidents and SLAs","The QSR is attended by vendor staff only, while the service review includes the customer's team","The QSR is held annually, while the service review is held every quarter by convention"],"a":[1],"e":"A QSR reviews progress against business outcomes with the stakeholders who own them. An operational service review covers incidents, SLAs and technical operations. The other options reverse the focus or misstate attendance and cadence.","src":"original"},{"id":"S2-32","set":2,"d":4,"t":"For a 60-minute QSR with the customer's executive sponsor, which time allocation is MOST effective?","o":["Product roadmap 30 min, ticket and SLA statistics 15 min, outcomes 10 min, next steps 5 min","Outcomes 20 min, adoption and health 10, barriers 10, next-quarter priorities and asks 15, wrap-up 5","Vendor company update 20 min, new offers and promotions 20 min, outcomes 10 min, questions 10 min","Open discussion for the full hour, with no agenda or preparation shared with the customer"],"a":[1],"e":"Most of the time should go to outcome progress, risk and the decisions needed for the next quarter. Roadmap, ticket statistics and vendor news are secondary for an executive audience, and an unstructured hour wastes it.","src":"original"},{"id":"S2-33","set":2,"d":4,"t":"At a QSR, the executive sponsor asks, 'What return are we getting?' The CSM only has login counts and feature usage. What would have prepared the CSM BEST?","o":["A longer slide deck showing every feature the customer has activated since go-live","Baseline versus current values for the business metrics defined in the success plan","A list of the vendor's other customers in the same industry and the products they use","A forecast of next year's license consumption based on the customer's current seat growth"],"a":[1],"e":"Return is shown by movement in the business metrics the plan defined, measured against the baseline. Feature counts, peer lists and seat forecasts do not answer the sponsor's question.","src":"original"},{"id":"S2-34","set":2,"d":4,"t":"What is the BEST follow-up after a QSR?","o":["Wait for the customer to send their own notes, then correct any points that differ","Send a prompt summary of decisions, owners and dates, and update the success plan","Schedule the next QSR and use that meeting to confirm the actions from this one","Pass the meeting notes to the account manager and take no further action on the plan"],"a":[1],"e":"A prompt, clear summary with owners and dates keeps momentum, and the plan should reflect what was agreed. Waiting for the customer, deferring to the next QSR or handing off the notes lets actions stall.","src":"original"},{"id":"S2-35","set":2,"d":4,"t":"At a QSR, the customer reveals that its priorities have shifted toward a new market. Which TWO actions should the CSM take?","o":["Update the outcomes and success criteria in the plan to reflect the new priorities","Re-evaluate the use-case roadmap and the resources needed to support it","Keep the plan unchanged so progress can be compared with earlier quarters","Move the renewal discussion forward so the contract matches the new market"],"a":[0,1],"e":"When priorities move, the plan's outcomes, criteria, use cases and resourcing must follow. Keeping an out-of-date plan preserves comparison at the cost of relevance, and an early renewal talk does not respond to the shift.","src":"original"},{"id":"S2-36","set":2,"d":4,"t":"The customer success platform marks a strategic account red because usage dropped to zero overnight. The CSM suspects a data feed fault. What should the CSM do FIRST?","o":["Call the executive sponsor at once to ask why the team stopped using the platform","Verify the usage data feed is working before treating the drop as a customer issue","Open a high-severity case against the customer's administrator for the service outage","Change the account's coverage to the high-touch tier and begin the risk playbook"],"a":[1],"e":"A sudden drop to zero is more likely a data or integration fault. Verifying the data first avoids a false alarm to the customer. Escalating or launching a risk playbook on bad data harms trust.","src":"original"},{"id":"S2-37","set":2,"d":4,"t":"Which activity is BEST suited to scaled or digital engagement rather than 1:1 CSM time?","o":["Rebuilding the executive relationship after a sponsor change at a strategic account","Delivering onboarding tips and how-to content to a large long-tail customer segment","Negotiating contract changes with a customer's procurement team ahead of the renewal date","Leading a root-cause review after a major outage at a high-value strategic account"],"a":[1],"e":"Repeatable educational content for many customers is where digital programs add leverage. Executive relationships, negotiation and outage reviews need judgment and personal presence.","src":"original"},{"id":"S2-38","set":2,"d":4,"t":"A customer executive has limited time and has asked for a short update before a board meeting. Which format is BEST?","o":["A one-page summary of outcome progress against targets, the top risk and the decision needed","A 40-slide deck covering every use case, feature, ticket and milestone since the start","A raw export of the usage dashboard, so the executive can draw their own conclusions","A verbal update only, with no written material to avoid putting details in writing"],"a":[0],"e":"Executives need a concise view of results, risk and decision required. A long deck or raw data export puts the work of synthesis on the executive, and a verbal-only update leaves no reference.","src":"original"},{"id":"S2-39","set":2,"d":4,"t":"Which TWO responsibilities belong primarily to the account manager rather than the CSM?","o":["Leading the commercial process, including quotes, pricing and contract terms for renewal and expansion","Owning the overall sales relationship and opportunity pipeline for the account and its business units","Maintaining the success plan and tracking progress against its outcomes with the customer's stakeholders","Running adoption playbooks for the customer when a usage-based health trigger fires in the platform"],"a":[0,1],"e":"The account manager leads commercial activity and the sales pipeline. The CSM maintains the success plan and runs adoption-focused playbooks. The two should coordinate but not blur these ownership lines.","src":"original"},{"id":"S2-40","set":2,"d":4,"t":"A customer executive escalates a priority-one outage during a QSR preparation week. What is the CSM's MOST appropriate role?","o":["Take over technical troubleshooting so the support engineer can step back from the incident","Coordinate resources, keep the customer informed, and track the impact on the plan's outcomes","Postpone all communication until the incident is closed and a root cause report is ready","Hand the matter entirely to support and avoid contact until the incident is resolved"],"a":[1],"e":"The CSM does not replace support engineering. The CSM makes sure the right resources are engaged, communicates clearly with the customer, and assesses the effect on outcomes. Silence or full hand-off weakens trust.","src":"original"},{"id":"S2-41","set":2,"d":5,"t":"A cohort of customers started the year with $2,400,000 in ARR. During the year it added $420,000 in expansion, lost $120,000 to downgrades and lost $240,000 to cancellations. What are gross revenue retention (GRR) and net revenue retention (NRR)?","o":["GRR 85%, NRR 102.5%","GRR 90%, NRR 107.5%","GRR 85%, NRR 117.5%","GRR 102.5%, NRR 85%"],"a":[0],"e":"GRR = (2,400,000 - 120,000 - 240,000) / 2,400,000 = 85%. NRR = (2,040,000 + 420,000) / 2,400,000 = 102.5%. GRR 90% omits the downgrades, 117.5% ignores losses, and the last option swaps the two measures.","src":"orig
