inal"},{"id":"S2-42","set":2,"d":5,"t":"A vendor reports 95% logo retention but only 82% gross revenue retention. What is the BEST interpretation?","o":["The numbers conflict, so the revenue figure must be incorrect and should be recalculated","Losses and downgrades were concentrated in large accounts, so revenue fell more than logos","Customer success is performing well, because logo retention is the more important measure","Expansion revenue is offsetting churn, which is why the revenue figure is lower than the logo figure"],"a":[1],"e":"If few customers left but revenue fell by more, the lost or reduced accounts carried a disproportionate share of ARR. Expansion would raise NRR, not lower GRR, and GRR excludes expansion by definition.","src":"original"},{"id":"S2-43","set":2,"d":5,"t":"One hundred twenty days before renewal, an account is yellow. The sponsor is engaged, adoption is 55% of entitlement, and one blocked use case explains much of the gap. What is the BEST renewal plan?","o":["Hold the renewal quote until the 30-day mark, so the customer has less time to negotiate","Clear the barrier, run a targeted adoption push, and prepare a value summary for the sponsor","Offer a discount now to secure a commitment before the adoption gap becomes visible to them","Wait for the customer to raise renewal, to avoid appearing commercial in the relationship"],"a":[1],"e":"There is time to address the cause of the gap, show value and align internally. Sitting on the quote, discounting early or waiting passively does not improve the renewal position.","src":"original"},{"id":"S2-44","set":2,"d":5,"t":"A customer plans to renew 30% fewer licenses because 30% have been inactive for six months despite enablement efforts. What is the BEST response?","o":["Refuse the reduction and cite the contract term, to protect the vendor's revenue","Offer a discount to keep the full count, on the assumption that usage will recover later","Support right-sizing to actual need, and agree a path to re-expand as use cases mature","Ignore the request and let the account manager handle it without any CSM involvement"],"a":[2],"e":"Right-sizing preserves trust and the relationship, and a defined path to re-expand keeps the growth door open. Refusing or discounting for unused licenses damages credibility, and ignoring the request abandons the CSM's role in value.","src":"original"},{"id":"S2-45","set":2,"d":5,"t":"Which TWO are the STRONGEST signals of an expansion opportunity?","o":["Consumption is approaching entitlement and user demand keeps growing","The sponsor asks to solve the same problem in another business unit","The renewal date for the current contract is approaching within the year","A competitor has recently reduced list prices in the customer's market"],"a":[0,1],"e":"Demand outgrowing entitlement and requests to extend a proven solution to other teams are customer-driven signals grounded in realized value. A renewal date and competitor pricing are not indicators of customer need.","src":"original"},{"id":"S2-46","set":2,"d":5,"t":"An account at 25% adoption is pitched an add-on module by the account manager, who needs to hit a quarterly target. What should the CSM advise?","o":["Support the pitch, because added capability will increase engagement across the account","Hold the pitch until value is shown, unless the add-on removes an adoption barrier","Block any contact with the customer by the account manager until adoption passes 50%","Ask the customer to pre-pay for the add-on, to be used after adoption improves"],"a":[1],"e":"Expanding on top of low adoption risks overbuying and damaging trust. The sensible position is to prove value first, unless the add-on specifically solves the barrier holding adoption back. Blocking or pre-payment is not a collaborative solution.","src":"original"},{"id":"S2-47","set":2,"d":5,"t":"After handoff, the CSM learns the customer believes six use cases were included, but the sales documentation lists three. What is the BEST action?","o":["Deliver the three documented use cases and tell the customer the others are out of scope","Deliver all six use cases at no additional cost to avoid any disagreement at the start","Reconcile scope with the customer and account manager early, then document it in the plan","Wait until the first QSR to raise the difference, once the customer has seen some results"],"a":[2],"e":"A mismatch in expectations needs to be resolved early and openly with both the customer and the commercial owner, then documented. Silently enforcing scope, giving away work or waiting increases the damage.","src":"original"},{"id":"S2-48","set":2,"d":5,"t":"When speaking with the economic buyer ahead of renewal, which evidence is MOST persuasive?","o":["Quantified outcomes against baseline, tied to the original business case for the purchase","The number of features enabled on the platform and the size of the vendor's product catalog","The percentage of support cases closed within SLA across the whole contract term to date","The count of users who logged in at least once during the last twelve months of the term"],"a":[0],"e":"Economic buyers decide on business value. Outcomes against the baseline and the case that justified the purchase speak directly to it. Feature counts, SLA percentages and login counts describe activity.","src":"original"},{"id":"S2-49","set":2,"d":5,"t":"A post-mortem on a churned account finds the health score was green until the quarter before cancellation. Which TWO follow-up actions are MOST appropriate?","o":["Review which score components and weights failed to signal the risk, and revise the model","Add leading signals such as executive engagement and outcome progress to the score","Retire the health score, since it did not predict this loss","Record the loss as a customer decision unrelated to anything the CS team could change"],"a":[0,1],"e":"A miss is a chance to improve the model. Re-examining weights and adding leading indicators such as sponsor engagement and outcome progress strengthens prediction. Dropping the score loses a useful tool, and dismissing the loss prevents learning.","src":"original"},{"id":"S2-50","set":2,"d":5,"t":"In the LAER lifecycle (Land, Adopt, Expand, Renew), which activity belongs PRIMARILY to Expand rather than Adopt?","o":["Delivering role-based enablement so teams can use the purchased solution after go-live","Confirming the first measurable value milestone with the executive sponsor and the project owner","Finding other business units with the same need and sizing the value with the account manager","Removing the technical barrier that has stalled a planned use case since the go-live date"],"a":[2],"e":"Adopt concentrates on enablement, first value and removing barriers to current use cases. Expand looks for new use cases or business units with a quantified case, coordinated with the commercial owner.","src":"original"},{"id":"S3-01","set":3,"d":1,"t":"Which statement BEST describes the value realization journey?","o":["The path from purchase, through adoption, to the customer reaching its intended outcomes","The sequence of quotes, invoices and payments a customer follows from purchase to renewal","The internal approval path a vendor uses to move a deal from forecast to booked revenue","The list of product features released across versions during the life of a subscription"],"a":[0],"e":"Value realization is the customer's path from buying to actually achieving its intended business outcomes, with value confirmed at milestones along the way. The other options describe billing, internal sales approval and product release history.","src":"blueprint","s":"1.2"},{"id":"S3-02","set":3,"d":1,"t":"Why does a CSM start building the renewal case during the Adopt stage of LAER instead of waiting for the Renew stage?","o":["Customers renew based on the value they have already realized, so adoption results become the renewal evidence","Renewal pricing is fixed at purchase, so nothing done in the Adopt stage can change the renewal outcome","The Renew stage belongs to finance, so the CSM has no role once adoption work has begun in the account","Adoption and renewal are the same activity, so the stages can be treated as interchangeable in practice"],"a":[0],"e":"Renewal is earned through value delivered during adoption, so the CSM builds the case continuously. Pricing is not fixed at purchase, the CSM does contribute to Renew, and the stages are distinct even though they connect.","src":"guide","s":"1.3"},{"id":"S3-03","set":3,"d":1,"t":"According to the learning guide, how far ahead of renewal should the at-risk analysis start for HIGH-TOUCH customers?","o":["Six months to a year before renewal, depending on account size and solution type","Ninety, sixty and thirty days before renewal, in the same pattern used for tech-touch accounts","Only after the customer signals that it is considering other vendors for the next term","On the renewal date itself, after the customer has confirmed its intent to continue"],"a":[0],"e":"The guide says high-touch customers should be analyzed six months or even a year before renewal. The 90/60/30-day pattern is for tech-touch and low-touch customers. Waiting for a signal or for the renewal date is too late to change the outcome.","src":"guide","s":"1.4"},{"id":"S3-04","set":3,"d":1,"t":"According to the learning guide, when does the at-risk analysis typically take place for LOW-TOUCH and tech-touch customers?","o":["90, 60 and 30 days before the upcoming renewal","Twelve months before the renewal date arrives","Only in the final week before the contract expires","After the customer has already sent a non-renewal notice"],"a":[0],"e":"For low-touch and tech-touch customers the guide describes a data-driven, automated analysis at 90, 60 or 30 days before renewal, producing calls to action for customers below the health standard.","src":"guide","s":"1.4"},{"id":"S3-05","set":3,"d":1,"t":"In the 820-605 v3.0 exam blueprint, what does PVI stand for?","o":["Partner Value Index","Practice Value Index","Product Velocity Indicator","Premium Value Initiative"],"a":[0],"e":"The v3.0 blueprint refers to the Cisco 360 Partner Value Index (PVI). Some third-party study pages misprint it as 'Practice Value Index'. The blueprint only names the PVI and its link to the CSM role, so confirm any further detail in Cisco's own training.","src":"blueprint","s":"1.5"},{"id":"S3-06","set":3,"d":1,"t":"Ninety days before renewal, the technical team knows the customer added a new site, but the renewals team is planning a flat renewal. What is the CSM's BEST contribution?","o":["Align Sales, Renewals and Technical on one shared view of the account before contacting the customer","Let each team contact the customer separately so the customer hears every perspective on the account","Wait for the renewals team to finish its plan, then correct it during the final negotiation round","Ask the customer to settle the difference with the renewals team directly during its renewal call"],"a":[0],"e":"Cross-functional alignment means the customer hears one consistent story built on shared facts. Separate contacts, late correction or pushing the work to the customer create confusion and lose the growth opportunity.","src":"general","s":"1.7"},{"id":"S3-07","set":3,"d":1,"t":"According to the learning guide, what is the purpose of customer success management?","o":["To maximize the value gained by both the customer and the solution provider","To maximize the license revenue collected from each customer during the term","To reduce the number of support cases handled by the vendor each quarter","To make the customer fully independent of the vendor after the onboarding phase"],"a":[0],"e":"The guide's 'what' statement is that customer success management maximizes value for both sides. Revenue maximization, case reduction and removing the vendor are not the stated purpose.","src":"guide","s":"1.1"},{"id":"S3-08","set":3,"d":1,"t":"Why did many customers initially resist the move from perpetual licenses to subscriptions?","o":["They felt they were being asked to rent back a product they once owned outright","They believed subscription vendors could not provide updates for the software they use","They were required by regulation to hold perpetual licenses for audit purposes at all times","They knew subscriptions always cost more than perpetual licenses during the first year"],"a":[0],"e":"The guide notes the perception of 'renting back' a purchased product, and says vendors had to show added value to build loyalty. Over time customers accepted and then preferred subscriptions.","src":"guide","s":"1.1"},{"id":"S3-09","set":3,"d":1,"t":"According to the learning guide, why should customer success be organized separately from sales?","o":["The CSM builds a different kind of trust, since success helps customers achieve outcomes while sales sells","Sales teams are not permitted to speak with customers after a contract has been signed and booked","The customer success function needs a smaller budget and therefore should not sit under sales leadership","Customer success and sales share no goals, so the two should never work together on an account"],"a":[0],"e":"The guide says the CSM gains a different trust relationship, which can make the CSM a strategic advisor, and should have hierarchical parity with sales. It does not say the two cannot work together.","src":"guide","s":"1.7"},{"id":"S3-10","set":3,"d":1,"t":"A CSM keeps delivering hands-on training to a customer's team every month. Which guidance from the learning guide is being missed?","o":["Act as organizer and enabler, train a power user, and know when to charge for professional services","Deliver all training personally so the customer never needs any second source of product knowledge","Stop all training once the contract is signed, to protect the vendor's own services revenue","Hand every request to the support team and avoid contact with the customer's staff"],"a":[0],"e":"The guide promotes customer self-sufficiency: access to online training, train-the-trainer, the CSM as organizer and enabler rather than a full-time trainer, and knowing when to begin charging for professional services.","src":"guide","s":"1.1"},{"id":"S3-11","set":3,"d":2,"t":"A CSM inherits an account after the account manager left, with little history of the original sale. What is the BEST way to answer WHO, WHAT and WHY for the engagement?","o":["Combine CRM records, the sales team and partner input, then validate the answers with the customer","Rely on CRM records alone, since they hold the official history of the purchase and its contacts","Wait until the first renewal conversation, when the customer will volunteer its goals unprompted","Ask the support team to list the customer's tickets and infer the goals from the issues raised"],"a":[0],"e":"The guide says to look in the CRM, the sales team, the partner and the customer for validation. Validation matters because assumptions about what people want to achieve are often wrong.","src":"guide","s":"2.1"},{"id":"S3-12","set":3,"d":2,"t":"What is the main purpose of an Adoption Accountability Plan (AAP)?","o":["To record who is accountable for each action needed to drive adoption of the solution","To set the price and payment schedule for the customer's subscription over its term","To list the product enhancements the vendor has promised on its public roadmap","To log every support incident raised by the customer during the deployment phase"],"a":[0],"e":"The blueprint lists the purpose and components of the AAP under success plan creation. As the name indicates, it assigns accountability for adoption actions. The blueprint wording is brief, so check details such as the exact template against Cisco's training.","src":"blueprint","s":"2.3"},{"id":"S3-13","set":3,"d":2,"t":"Which of the following is NOT listed in the learning guide as a common element of a customer success plan?","o":["The vendor's margin on each product sold to the customer","The customer profile and the solution stakeholders with their business objectives","The account baseline and the KPIs to be tracked over time","Barriers with contingency plans, and expand opportunity planning for the account"],"a":[0],"e":"Listed elements include customer profile, internal resources, stakeholders and objectives, account baseline, initiative prioritization and timeline, KPIs, adoption lifecycle position, barriers and contingency plans, and expand opportunity planning. Vendor margin is internal commercial data.","src":"guide","s":"2.4"},{"id":"S3-14","set":3,"d":2,"t":"Which is a stated best practice for a customer success plan?","o":["Keep a concise template with internal-facing and customer-facing versions, updated frequently","Make it a detailed project plan that lists every technical task and the engineer who owns it","Restrict access to the CSM so the customer sees only the final results after each quarter","Update it once a year at renewal so the history stays stable and easy to compare later"],"a":[0],"e":"The guide stresses a concise template, internal and customer-facing versions, frequent updates, and says explicitly that it is not a project plan. It should be available to all internal stakeholders and agreed with the customer.","src":"guide","s":"2.4"},{"id":"S3-15","set":3,"d":2,"t":"Which KPI statement meets all SMART criteria?","o":["Reduce password-reset tickets from 1,000 to 700 per month by Q3 through self-service adoption","Reduce the number of help-desk tickets as much as possible over the coming year of operations","Improve the end-user experience of the service desk for all employees across every location","Launch the self-service portal as soon as the project team is in a position to do so"],"a":[0],"e":"SMART means Specific, Measurable, Achievable, Relevant and Time-bound. Only the first statement has a specific metric, baseline, target and deadline. The others are vague, unmeasured or have no end date.","src":"general","s":"2.5"},{"id":"S3-16","set":3,"d":2,"t":"The customer says 'rapid onboarding of new branches' is critical to its strategy. Which KPI BEST measures that critical success factor (CSF)?","o":["Average days from branch order to branch go-live","Total number of access points shipped this quarter","Number of administrators who attended product training","Monthly count of support cases for the branch network"],"a":[0],"e":"A KPI should measure progress on the critical success factor itself. Days from order to go-live measures onboarding speed. Shipments, training attendance and case counts are activities or side measures.","src":"guide","s":"2.5"},{"id":"S3-17","set":3,"d":2,"t":"Which is an INTANGIBLE benefit of a collaboration solution?","o":["Improved employee satisfaction with how teams work together","A $200,000 annual reduction in third-party conferencing fees","A 30% reduction in travel expenses across all offices","A drop in call-setup time from 40 seconds to 10 seconds"],"a":[0],"e":"Tangible benefits can be directly quantified, such as fees saved, expenses cut or time reduced. Satisfaction and collaboration culture are intangible: real, but harder to put a number on.","src":"general","s":"2.6"},{"id":"S3-18","set":3,"d":2,"t":"A customer invests $500,000 and realizes net benefits of $250,000 per year. What is the cumulative ROI after three years?","o":["50%","33%","150%","75%"],"a":[0],"e":"Three years of benefit is $750,000. ROI = (750,000 - 500,000) / 500,000 = 50%. 150% divides the gross benefit by cost without subtracting cost. 33% and 75% do not follow from the figures.","src":"general","s":"2.6"},{"id":"S3-19","set":3,"d":2,"t":"For the task 'complete administrator training', the customer's IT Director signs off on the result, two engineers do the work, the CSM advises, and the CIO is kept updated. Who is ACCOUNTABLE in the RACI?","o":["The customer's IT Director","The two engineers doing the work","The CSM advising the team","The CIO being kept updated"],"a":[0],"e":"In RACI, Responsible does the work, Accountable owns and signs off the outcome, Consulted gives input and Informed is kept updated. The IT Director is accountable, the engineers responsible, the CSM consulted and the CIO informed.","src":"guide","s":"2.3"},{"id":"S3-20","set":3,"d":3,"t":"Which TWO lenses of the Observation, Conversation, Data (OCD) framework are oriented toward high-touch models?","o":["Observation","Conversation","Data","Benchmarking"],"a":[0,1],"e":"The guide says observation and conversation suit high-touch models, while data is critical across all touch models and especially for low-touch and tech-touch. Benchmarking is not one of the three lenses.","src":"guide","s":"3.1"},{"id":"S3-21","set":3,"d":3,"t":"In a workshop, end users tell the CSM they did not know the new feature was part of their subscription. Which OCD lens uncovered this, and which barrier type does it represent?","o":["Conversation lens; a people barrier of low awareness and skills","Data lens; a technology barrier caused by a product defect","Observation lens; a process barrier caused by contract terms","Conversation lens; a technology barrier caused by licensing limits"],"a":[0],"e":"Direct dialogue with users is the conversation lens. Not knowing the product or feature exists is an awareness and skills gap, which falls under the people category.","src":"guide","s":"3.1"},{"id":"S3-22","set":3,"d":3,"t":"A customer's change-approval process takes six weeks for every configuration change, delaying planned use cases. Using the People, Process, Technology framework, how is this barrier categorized?","o":["Process","People","Technology","Commercial"],"a":[0],"e":"A slow approval workflow is a process barrier. It needs governance or workflow change, not training (people) or a product fix (technology). Commercial is not one of the three categories.","src":"general","s":"3.2"},{"id":"S3-23","set":3,"d":3,"t":"According to the learning guide, which action is typically needed to overcome corporate culture barriers such as resistance to change?","o":["Executive sponsorship and awareness campaigns that drive a change in mindset","Additional end-user training on how to operate the product features day to day","A technical workaround for the product defect that is blocking the planned use case","A larger discount offered to the customer's procurement team on the next renewal"],"a":[0],"e":"The guide calls culture barriers a people problem owned at the CxO or business-outcome-owner level, resolved through executive sponsorship and executive-sponsored campaigns. Training and technical fixes address operational and technical barriers.","src":"guide","s":"3.2"},{"id":"S3-24","set":3,"d":3,"t":"A CSM has three barriers. A blocks a use case worth about $400k in annual savings and can be fixed within a month. B blocks a $50k use case and takes a quarter. C affects a use case with no measured value and can be fixed in a day. How should the CSM prioritize?","o":["A first, because it blocks the most value and can be cleared quickly","C first, because the fastest fix reduces the open barrier count right away","B first, because it takes the longest and needs the earliest possible start","All three together, so the customer sees equal effort on every item"],"a":[0],"e":"Barriers are prioritized by their impact on value realization. A blocks the most value and is quick to clear. Fixing C first helps a use case with no measured value, and B is both lower value and slower.","src":"general","s":"3.3"},{"id":"S3-25","set":3,"d":3,"t":"Which statement describes a high-touch CSM according to the learning guide?","o":["Attached to one or a few large accounts, with in-person relationships and an industry focus","Manages many small and mid-sized accounts mainly through virtual meetings and tech-touch programs","Interacts with customers only through email, in-app messages and social media channels","Supports a reseller partner's own customer success practice rather than end customers"],"a":[0],"e":"The guide describes high-touch CSMs as attached to one or a few large accounts, often aligned to verticals rather than geographic territories. The other options describe low-touch, tech-touch and reseller partner CSMs.","src":"guide","s":"3.5"},{"id":"S3-26","set":3,"d":3,"t":"An account's health score falls from green to red. Which response BEST shows how a health signal becomes a Call to Action (CTA)?","o":["Create a CTA assigned to the CSM with a due date to hold an adoption review and executive call","Add the account to the next monthly newsletter list so the customer sees new feature updates","Wait for the next QSR and mention the score drop under any other business at the end","Lower the account's coverage tier until the score returns to green on its own"],"a":[0],"e":"A CTA converts a signal into a specific, owned, time-bound action. Newsletters, waiting for the next QSR or reducing coverage do not respond to the risk.","src":"general","s":"3.6"},{"id":"S3-27","set":3,"d":3,"t":"What is the main benefit of internal playbooks for barrier resolution?","o":["They capture proven steps, owners and escalation paths so similar barriers are resolved consistently","They remove the need for the CSM to discuss barriers directly with the customer's stakeholders","They guarantee that every barrier will be resolved within one business week of being raised","They set the customer's contract terms whenever a barrier leads to a price change"],"a":[0],"e":"Playbooks standardize the response to known barrier types, which speeds resolution and keeps quality consistent across CSMs. They support, but do not replace, conversation with the customer, and cannot guarantee timelines.","src":"general","s":"3.7"},{"id":"S3-28","set":3,"d":3,"t":"According to the learning guide, what happens to customers who fall below the required health index standard ahead of renewal?","o":["They are flagged to the CSM and the sales and renewals team, who analyze the data and agree a plan","They are removed from the CSM's portfolio so effort can be directed to healthier accounts","They automatically receive a discount offer ahead of the renewal conversation to protect revenue","They are moved to a different licensing model without a discussion with the customer"],"a":[0],"e":"The guide describes a data-driven at-risk process: customers below the health standard are flagged to the CSM and the sales and renewals team, who agree a plan so the customer is in good shape for renewal.","src":"guide","s":"3.4"},{"id":"S3-29","set":3,"d":4,"t":"Which sequence BEST reflects the customer journey from pre-sales to renewal readiness?","o":["Understand who, what and why; hand off at Land; plan and onboard; drive adoption and QSRs; run renewal risk analysis","Run renewal risk analysis; hand off at Land; understand who, what and why; plan and onboard; drive adoption and QSRs","Plan and onboard; understand who, what and why; run renewal risk analysis; hand off at Land; drive adoption and QSRs","Drive adoption and QSRs; hand off at Land; understand who, what and why; plan and onboard; run renewal risk analysis"],"a":[0],"e":"The journey runs from understanding the customer, through the handoff and onboarding, to adoption with regular reviews, and finally renewal readiness. The other orders place renewal analysis or adoption before the customer is understood or onboarded.","src":"general","s":"4.1"},{"id":"S3-30","set":3,"d":4,"t":"How does the learning guide describe the relationship between the success plan and the QSR?","o":["The plan is customer-agreed and provides the data foundation for reviews such as the QSR","The plan is created only after the QSR, using the meeting notes as its only source of content","The plan is an internal-only document that must never be shown to the customer at a QSR","The plan and the QSR are the same document, produced once a year for the account"],"a":[0],"e":"The guide says the plan provides a data foundation for internal reviews and customer-facing reviews like the QSR, and is a customer-agreed document. A customer-facing version of the plan can be used in the QSR.","src":"guide","s":"4.2"},{"id":"S3-31","set":3,"d":4,"t":"According to the learning guide, which customer stakeholder should the CSM spend most of their time with?","o":["The director or manager of the relevant IT area","The CIO, through frequent weekly meetings","The operations engineers, to the exclusion of other roles","The procurement lead, during renewal season only"],"a":[0],"e":"The guide says the director is the person to spend the most time with, because directors help align resources, set up the plan and KPIs, and open doors to executives and lines of business. CIO time is limited, and operations focus on mastery of the tools.","src":"guide","s":"4.2"},{"id":"S3-32","set":3,"d":4,"t":"A CSM gets a rare 20-minute meeting with the customer's CIO. Which approach is BEST?","o":["Plan the conversation, share peer insight and come with a clear ask or recommendation","Walk through feature-level product training so the CIO understands the technology fully","Share the complete ticket history so the CIO can review every incident from the year","Keep the meeting purely social to build a relationship before asking for anything at all"],"a":[0],"e":"The guide says CIO time is limited, they expect an ask or recommendation, and they value insight into how peers approach similar projects. Feature training and ticket histories suit operations stakeholders.","src":"guide","s":"4.2"},{"id":"S3-33","set":3,"d":4,"t":"In the 820-605 v3.0 exam blueprint, what does PXP stand for?","o":["Partner Experience Platform","Product Experience Portal","Partner Exchange Program","Performance Expectation Plan"],"a":[0],"e":"The blueprint lists 'Explain the Partner Experience Platform (PXP)' under tooling. The blueprint gives only the name, so study how Cisco's own training describes what the platform does.","src":"blueprint","s":"4.3"},{"id":"S3-34","set":3,"d":4,"t":"According to the exam blueprint, what are Lifecycle Advantage (LCA) and LCA-CS used for?","o":["Digital guidance for customers through the lifecycle","Negotiating enterprise agreement pricing with customers","Recording hardware serial numbers for warranty claims","Managing a CSM's personal time and travel schedule"],"a":[0],"e":"The blueprint says 'Describe the use of Lifecycle Advantage (LCA) and LCA-CS for digital guidance'. The other options are unrelated functions. Check Cisco's training for the specifics of each tool.","src":"blueprint","s":"4.4"},{"id":"S3-35","set":3,"d":4,"t":"Which workspace does the exam blueprint name for tracking consumption under an Enterprise Agreement?","o":["Enterprise Agreement Workspace (EAWS)","Partner Value Index (PVI) dashboard","Operating Expense Ledger (OEL)","Quarterly Success Review (QSR) deck"],"a":[0],"e":"The blueprint states 'Explain how to track consumption using the Enterprise Agreement Workspace (EAWS)'. PVI is an index, QSR is a review process, and the Operating Expense Ledger is not a CSM tool.","src":"blueprint","s":"4.5"},{"id":"S3-36","set":3,"d":4,"t":"Which description of the Smart Account and Virtual Account hierarchy is correct?","o":["A Smart Account is the customer-level container; Virtual Accounts divide its licenses, for example by region","A Virtual Account is the customer-level container, and Smart Accounts divide its licenses by product family","Smart Accounts and Virtual Accounts are unrelated, and each license belongs to both of them in every case","A Smart Account is created for each license, and Virtual Accounts are created for each user"],"a":[0],"e":"A Smart Account sits at the customer or organization level. Virtual Accounts are subdivisions inside it that group licenses and devices, such as by department, region or project.","src":"general","s":"4.6"},{"id":"S3-37","set":3,"d":4,"t":"A customer wants its London and Singapore IT teams to manage their own licenses while keeping one customer-wide view. Which construct fits?","o":["Separate Virtual Accounts under a single Smart Account","Two unrelated Smart Accounts, one for each office","One Virtual Account shared by both offices","A single Smart Account with no further structure"],"a":[0],"e":"Virtual Accounts let each team manage its own licenses, and keeping them under one Smart Account preserves the single customer-wide view. Unrelated Smart Accounts would split the view.","src":"general","s":"4.6"},{"id":"S3-38","set":3,"d":5,"t":"A customer signs a three-year Enterprise Agreement with a total contract value (TCV) of $500,000, billed evenly. What is the approximate annual contract value (ACV)?","o":["$166,667","$500,000","$1,500,000","$250,000"],"a":[0],"e":"ACV = TCV / contract years = 500,000 / 3, about $166,667. $500,000 is the TCV itself, $1,500,000 multiplies instead of dividing, and $250,000 would imply two years.","src":"guide","s":"5.1"},{"id":"S3-39","set":3,"d":5,"t":"A customer pays $12,000 per month for a subscription. What is the annual recurring revenue (ARR)?","o":["$144,000","$12,000","$120,000","$1,440,000"],"a":[0],"e":"ARR is the monthly recurring revenue (MRR) multiplied by 12: 12,000 x 12 = $144,000. $12,000 is the MRR itself, $120,000 uses ten months, and $1,440,000 is off by a factor of ten.","src":"general","s":"5.1"},{"id":"S3-40","set":3,"d":5,"t":"Forty renewals were due this quarter and 31 closed on or before the contract expiry date. What is the on-time renewal rate (OTRR)?","o":["77.5%","72.5%","80%","75%"],"a":[0],"e":"OTRR = renewals closed on time / renewals due = 31 / 40 = 77.5%. The other values correspond to 29, 32 and 30 on-time renewals.","src":"general","s":"5.1"},{"id":"S3-41","set":3,"d":5,"t":"A cohort starts the year at $1,500,000 ARR. It adds $330,000 in expansion, loses $60,000 to downgrades and $120,000 to cancellations. What is net revenue retention (NRR)?","o":["110%","88%","118%","122%"],"a":[0],"e":"NRR = (1,500,000 + 330,000 - 60,000 - 120,000) / 1,500,000 = 1,650,000 / 1,500,000 = 110%. 88% is gross retention (no expansion), 118% ignores cancellations and 122% ignores both losses.","src":"general","s":"5.1"},{"id":"S3-42","set":3,"d":5,"t":"Which action MOST directly shortens time to value (TTV)?","o":["Agree the first use case and success criteria early, then clear the barriers blocking it","Extend the contract term so the customer has a longer period to realize its benefits","Schedule the first QSR for the end of the first year of the subscription","Add more modules so the customer has a wider choice of features to start with"],"a":[0],"e":"TTV falls when the first valuable use case is defined early and barriers are removed. Longer terms, a late first review and more modules do not accelerate the first measurable benefit.","src":"general","s":"5.1"},{"id":"S3-43","set":3,"d":5,"t":"According to the learning guide, what describes an Enterprise Agreement (EA)?","o":["A fixed-price agreement for a software suite across the enterprise, usually three to five years","A month-to-month agreement for a single product, billed only for the users active each month","A one-time perpetual purchase of a single product with no renewal and no support","A hardware lease with a buy-out option at the end of the agreed lease term"],"a":[0],"e":"The guide describes EAs as letting customers consume a suite of products across the enterprise, covering perpetual and subscription models, at a fixed price with caveats, typically for three to five years.","src":"guide","s":"5.2"},{"id":"S3-44","set":3,"d":5,"t":"A customer on an EA grows significantly during the term. According to the learning guide, what may the vendor do?","o":["Reassess and adjust the pricing, because EAs are fixed price with caveats for growth","Cancel the agreement and require the customer to repurchase everything at list price","Ignore the growth, because EA pricing can never change at any point during the term","Charge the customer a cancellation fee for exceeding the original user count"],"a":[0],"e":"The guide says EAs are fixed-price with caveats that allow the vendor to reassess and adjust pricing when the customer grows during the term. The blueprint also lists 'True Forward' under EAs, so check Cisco's training for that process.","src":"guide","s":"5.2"},{"id":"S3-45","set":3,"d":5,"t":"A customer completes its core use cases and starts asking about advanced analytics features. Which expansion signal is this?","o":["Maturity","Usage","Strategic pivot","Renewal risk"],"a":[0],"e":"The blueprint names three expansion signals: usage, maturity and strategic pivot. Completing the core use cases and asking for advanced capability shows growing maturity.","src":"blueprint","s":"5.3"},{"id":"S3-46","set":3,"d":5,"t":"A customer announces a cloud-first strategy that will move several workloads to new platforms. Which expansion signal is this?","o":["Strategic pivot","Maturity","Usage","Health decline"],"a":[0],"e":"A change in the customer's strategic direction is a strategic pivot signal, which can create new needs the CSM can map to additional solutions. Usage would show consumption nearing entitlement, and maturity would show readiness for advanced capability.","src":"blueprint","s":"5.3"},{"id":"S3-47","set":3,"d":5,"t":"According to the learning guide, when should expansion planning begin?","o":["When the customer is first engaged, ideally in evaluation","After the customer has renewed at least twice with the vendor","Only in the last quarter of the contract term before renewal","After the customer asks for a quote for additional products"],"a":[0],"e":"The guide says planning for expansion should begin when you engage the customer, ideally in the evaluation stage or earlier, even though transactions usually happen after a positive experience or near renewal.","src":"guide","s":"5.3"},{"id":"S3-48","set":3,"d":5,"t":"Which element makes an expansion business case MOST credible to the customer's executives?","o":["Quantified value of the new capability tied to outcomes already realized by the customer","A list of new product features with their list prices and the discounts that are available","A comparison of the vendor's revenue targets against the customer's current annual spend","Quotes from other customers describing how much they like the vendor's brand and products"],"a":[0],"e":"Executives respond to quantified business value linked to results they have already seen. Feature lists, vendor targets and brand quotes do not make the customer's own case.","src":"general","s":"5.4"},{"id":"S3-49","set":3,"d":5,"t":"After the customer agrees to an expansion opportunity, where should the CSM record it?","o":["In the expand opportunity planning section of the customer success plan","Only in a private email to the account manager, to avoid showing the customer","In the support ticketing system, linked to the customer's open cases","In the vendor's price book under the customer's account number"],"a":[0],"e":"Expand opportunity planning is a listed element of the success plan, so agreed opportunities are documented there, keeping the plan the single source of the customer's journey.","src":"guide","s":"5.5"},{"id":"S3-50","set":3,"d":5,"t":"According to the learning guide, what should be done for every customer that does not renew?","o":["Conduct a lost analysis or postmortem to understand why the customer left","Remove the customer's records to keep the retention data clean and consistent","Move the CSM to another account without any review of what happened","Wait for the customer to return and then review the history at that time"],"a":[0],"e":"The guide says an effective lost analysis should be conducted for every non-renewal. Without documenting why customers leave, a subscription business has no rudder.","src":"guide","s":"5.4"},{"id":"S3-51","set":3,"d":5,"t":"A customer using the vendor's collaboration suite is offered the vendor's security product for the same users. What type of expansion is this?","o":["Cross-sell","Upsell","Renewal","Downsell"],"a":[0],"e":"Cross-sell adds a different, adjacent product to an existing customer. Upsell moves the customer to a higher tier or more of the same product, renewal continues the existing contract, and downsell reduces it.","src":"general","s":"5.3"},{"id":"S4-01","set":4,"d":1,"t":"Which statement BEST separates customer success from customer support?","o":["Success proactively drives the outcomes the customer bought for; support reacts to issues the customer raises","Success handles only commercial topics such as pricing; support handles every technical topic raised","Success starts after the contract ends; support is the only team involved before the contract is signed","Success speaks only with executives; support speaks only with end users and the customer's operations team"],"a":[0],"e":"Customer success is proactive and outcome-focused across the lifecycle, while support is mainly reactive and case-driven. The other options invent boundaries based on topic, timing or audience.","src":"general","s":"1.1"},{"id":"S4-02","set":4,"d":1,"t":"Which metric is a LEADING indicator of renewal risk?","o":["A steady fall in weekly active users over six weeks","The renewal rate recorded for last year's cohort","The revenue lost to non-renewals in the past quarter","The number of customers who left in the past year"],"a":[0],"e":"Leading indicators change before the outcome and give time to act, such as falling usage. Renewal rate, lost revenue and customer departures are lagging: they report what has already happened.","src":"general","s":"1.1"},{"id":"S4-03","set":4,"d":1,"t":"A customer has bought a collaboration suite but is still testing it in one small team four months after purchase. Which part of the value realization journey is MOST at risk?","o":["Time to first value, because the customer has not yet put the solution into production use","Contract negotiation, because the customer is still comparing prices with other vendors in the market","Renewal pricing, because the quoted price for the next term has already been fixed in writing","Product development, because the vendor needs a new feature before the customer can begin"],"a":[0],"e":"Value realization depends on moving from purchase to real use. Four months of testing in one team signals slow onboarding and a delayed first value. The other options do not follow from the facts given.","src":"general","s":"1.2"},{"id":"S4-04","set":4,"d":1,"t":"What is the CSM's MOST important job in the Land stage of LAER?","o":["Capture the customer's goals, success criteria and stakeholders so the handoff into onboarding is clean","Present the full list of upsell opportunities so they can be quoted before the first deployment starts","Close the renewal early so the customer is locked in before any adoption problems can appear","Collect the first invoice payment and confirm it with the customer's accounts payable team"],"a":[0],"e":"In Land the CSM makes sure the reasons for purchase, the expected outcomes and the people involved are recorded and handed over. Upsell, early renewal and invoicing are not the CSM's focus at this point.","src":"guide","s":"1.3"},{"id":"S4-05","set":4,"d":1,"t":"A customer has met its adoption goals and its executive sponsor now asks what else the vendor could do for its new regional business. Which LAER stage is this?","o":["Expand","Land","Adopt","Renew"],"a":[0],"e":"Expand follows adoption: realized value opens the conversation about additional needs. Land is the handoff after the sale, Adopt is the work to reach the goals, and Renew is the contract continuation.","src":"guide","s":"1.3"},{"id":"S4-06","set":4,"d":1,"t":"Which responsibility belongs MOST naturally to the CSM rather than to the account manager?","o":["Owning adoption progress and outcome tracking against the customer's success plan","Negotiating discounts and contract terms for the next purchase order from the customer","Issuing quotes and processing the customer's purchase orders through the order system","Setting the vendor's quarterly bookings targets for the whole sales territory"],"a":[0],"e":"The CSM is accountable for adoption and outcomes, while the account manager typically owns commercial negotiation and quoting. The two roles work together, but the primary accountability differs.","src":"general","s":"1.5"},{"id":"S4-07","set":4,"d":1,"t":"A team moves from answering customer questions as they arrive to monitoring health data and contacting at-risk customers first. What change in customer success practice maturity does this show?","o":["A shift from a reactive practice to a proactive, data-driven one","A shift from a proactive practice to a purely reactive one","A move from customer success to a pure sales function","A cut in coverage so that fewer customers are managed by the team"],"a":[0],"e":"The blueprint lists customer success practice maturity levels. Moving from responding to requests toward using data to act first is the standard direction of maturity: from reactive to proactive. Check the exact level names in Cisco's training.","src":"blueprint","s":"1.6"},{"id":"S4-08","set":4,"d":1,"t":"Which information is MOST valuable to carry from the sales team to the CSM at handoff?","o":["The customer's objectives, success criteria and key stakeholders agreed in the sale","The sales representative's commission structure and quota attainment for the closed deal","The competitor discount history the sales team used to win the deal in the final round","The internal forecast notes about how likely the customer is to expand next year"],"a":[0],"e":"A clean handoff tells the CSM why the customer bought and what success means. Commission, competitor discounting and internal forecasts do not help the CSM drive adoption.","src":"general","s":"1.7"},{"id":"S4-09","set":4,"d":2,"t":"Which question BEST uncovers a customer's intent for a new solution?","o":["What business result must this deliver in the next twelve months to count as a success?","Which version of the product would you like us to install on your servers during the first week?","How many users do you expect to log in on the first day after the system goes live?","Would you like to receive the vendor's monthly newsletter and product release announcements?"],"a":[0],"e":"Intent is the business result the customer wants. An outcome and a timeframe expose it. Version, user counts and newsletters are operational details that do not reveal why the customer is buying.","src":"general","s":"2.1"},{"id":"S4-10","set":4,"d":2,"t":"Which is a technology initiative rather than a strategic priority?","o":["Migrating the company's contact center to a cloud platform by the end of next year","Becoming the market leader in customer satisfaction within the retail banking sector","Entering three new regional markets while protecting the company's operating margin","Reducing the company's overall carbon footprint by thirty percent over five years"],"a":[0],"e":"A technology initiative is a project that changes systems or infrastructure. The other options are business-level priorities, which technology initiatives are meant to support.","src":"general","s":"2.1"},{"id":"S4-11","set":4,"d":2,"t":"A hospital buys a security solution mainly to avoid regulatory fines and data breaches. Which business driver does this MOST directly address?","o":["Risk","Cost","Profitability","Market share"],"a":[0],"e":"Avoiding fines and breaches reduces exposure to harmful events, which is the risk driver. Cost relates to spending, profitability to margin and revenue growth.","src":"general","s":"2.2"},{"id":"S4-12","set":4,"d":2,"t":"A retailer replaces four separate network vendors with one platform to lower its yearly support spend. Which business driver is this?","o":["Cost","Risk","Profitability","Compliance"],"a":[0],"e":"Consolidating vendors to spend less is a cost driver. A solution can serve more than one driver, but the stated aim here is lower spend.","src":"general","s":"2.2"},{"id":"S4-13","set":4,"d":2,"t":"A bank deploys analytics to launch a new digital lending product that should add revenue. Which business driver does this MOST directly support?","o":["Profitability","Cost","Risk","Employee retention"],"a":[0],"e":"Adding revenue through a new product supports profitability. Cost and risk drivers would focus on spending less or reducing exposure.","src":"general","s":"2.2"},{"id":"S4-14","set":4,"d":2,"t":"A RACI chart for the task 'approve the rollout plan' lists two people as Accountable. What is the problem, and what should the CSM do?","o":["Each task should have only one Accountable owner, so the team should agree on a single person","Nothing is wrong, since shared accountability makes every person equally responsible for the task","The chart needs a third Accountable person so that a majority can make the final decision","Accountable should be removed and replaced by Informed for everyone, to avoid conflict"],"a":[0],"e":"RACI works because exactly one person is Accountable for each task, while several can be Responsible, Consulted or Informed. Two owners blur ownership and slow decisions.","src":"guide","s":"2.3"},{"id":"S4-15","set":4,"d":2,"t":"Why does a customer success plan record an account baseline?","o":["So progress and value can later be measured against the starting position","So the vendor can calculate the commission owed to the sales team on the deal","So that the customer can no longer change any objective once the plan is agreed","So the support team can predict how many tickets the customer will open next year"],"a":[0],"e":"Without a starting measurement, improvement cannot be shown. The baseline anchors the KPIs. It does not lock objectives, drive commissions or forecast tickets.","src":"guide","s":"2.4"},{"id":"S4-16","set":4,"d":2,"t":"When should a CSM update the customer success plan?","o":["Frequently, and after any major change such as a new objective or barrier","Only at renewal, so the document stays stable throughout the whole term","Never, because the signed plan is a contractual document that cannot be changed","Only when the customer's legal team requests a change in writing"],"a":[0],"e":"The plan is a living document and best practice is frequent updates, plus updates after significant changes. Annual updates leave it out of date, and it is not a contract.","src":"guide","s":"2.4"},{"id":"S4-17","set":4,"d":2,"t":"What is the difference between a critical success factor (CSF) and a KPI?","o":["A CSF is what must go right for success; a KPI is the measure of how well it is going","A CSF is a financial figure reported to investors; a KPI is a task assigned to the CSM","A CSF is measured only at renewal; a KPI is measured only at the start of the project","A CSF and a KPI are two names for the same measurement used in every success plan"],"a":[0],"e":"A CSF names a condition essential to success, such as executive sponsorship. A KPI is a metric tracking progress, often tied to a CSF. They are related but not the same.","src":"general","s":"2.5"},{"id":"S4-18","set":4,"d":2,"t":"Which metric is the BEST leading KPI for adoption of a new collaboration tool?","o":["Percentage of licensed users active each week","Total contract value of the subscription","Number of licenses purchased at signing","Customer renewal rate for the previous year"],"a":[0],"e":"Weekly active use shows adoption as it develops, so action is still possible. Contract value and licenses purchased are fixed at signing, and last year's renewal rate is a lagging measure.","src":"general","s":"2.5"},{"id":"S4-19","set":4,"d":2,"t":"A customer invests $240,000 and expects a net benefit of $10,000 per month. What is the simple payback period?","o":["24 months","12 months","30 months","48 months"],"a":[0],"e":"Payback period = investment / monthly net benefit = 240,000 / 10,000 = 24 months. The other values do not follow from the figures.","src":"general","s":"2.6"},{"id":"S4-20","set":4,"d":2,"t":"Which outcome is an INTANGIBLE value of a security solution?","o":["Greater employee and customer confidence in how the company protects data","A $90,000 yearly reduction in breach-related insurance premiums","A 40% cut in the time to isolate an infected device on the network","Eight fewer hours of weekly manual log review for the security team"],"a":[0],"e":"Confidence and trust are real but hard to put a number on, so they are intangible. Premium savings, response time and hours saved can be measured directly.","src":"general","s":"2.6"},{"id":"S4-21","set":4,"d":3,"t":"Telemetry shows 70% of licensed users have never opened a purchased feature. Which OCD lens exposed this?","o":["Data","Observation","Conversation","Benchmarking"],"a":[0],"e":"Usage telemetry is the data lens. It reveals what people do at scale. Observation means watching how work is done and conversation means asking people directly.","src":"general","s":"3.1"},{"id":"S4-22","set":4,"d":3,"t":"During a site visit, a CSM sees analysts exporting reports to spreadsheets and fixing them by hand rather than using the new dashboard. Which lens found this?","o":["Observation","Data","Conversation","Contract review"],"a":[0],"e":"Seeing how people really work is the observation lens, and it often reveals workarounds that usage data alone does not explain.","src":"guide","s":"3.1"},{"id":"S4-23","set":4,"d":3,"t":"The customer's only certified administrator left the company and nobody took over the platform. How should this barrier be categorized?","o":["People","Process","Technology","Commercial"],"a":[0],"e":"Loss of skills and ownership is a people barrier. A process barrier concerns how work flows and a technology barrier concerns the product or its integration.","src":"general","s":"3.2"},{"id":"S4-24","set":4,"d":3,"t":"The new platform cannot connect to the customer's legacy billing system, which blocks the main use case. How should this barrier be categorized?","o":["Technology","People","Process","Cultural"],"a":[0],"e":"An integration limitation between systems is a technology barrier and may need engineering, a partner or a design change.","src":"general","s":"3.2"},{"id":"S4-25","set":4,"d":3,"t":"No one in the customer's organization is responsible for onboarding new employees to the tool, so usage stalls as people join. How should this barrier be categorized?","o":["Process","People","Technology","Financial"],"a":[0],"e":"A missing owner and routine for onboarding users is a process gap. The fix is a defined workflow and ownership, not product work or training alone.","src":"general","s":"3.2"},{"id":"S4-26","set":4,"d":3,"t":"Why does an unresolved barrier threaten renewal?","o":["It delays the value the customer expects, and unrealized value weakens the case for renewing","It automatically cancels the contract after ninety days without a written notice from either party","It increases the vendor's tax obligations in the country where the customer is located","It prevents the customer from receiving any invoices until the barrier has been closed"],"a":[0],"e":"Barriers delay time to value. Customers renew on value received, so unresolved barriers raise churn risk. The other options are not how contracts or billing work.","src":"general","s":"3.3"},{"id":"S4-27","set":4,"d":3,"t":"Which set lists typical components of a customer health score?","o":["Product usage, support experience, sentiment, financial standing and engagement","The CSM's tenure, the account's region, the sales quota and the vendor's fiscal calendar","The number of vendor employees assigned, the invoice format and the logo placement","The customer's office locations, headcount and the number of languages it uses"],"a":[0],"e":"Health scores combine signals about how the customer is using and feeling about the solution, plus financial and engagement data. The other lists describe unrelated attributes.","src":"guide","s":"3.4"},{"id":"S4-28","set":4,"d":3,"t":"A health score weights usage at 50%, support experience at 30% and sentiment at 20%. An account scores usage 40, support 90 and sentiment 70 (each out of 100). What is the weighted health score?","o":["61","67","70","55"],"a":[0],"e":"Weighted score = 0.5 x 40 + 0.3 x 90 + 0.2 x 70 = 20 + 27 + 14 = 61. A simple average would give about 67, which ignores the weights.","src":"general","s":"3.4"},{"id":"S4-29","set":4,"d":3,"t":"Which activity BEST fits a tech-touch (digital) engagement model?","o":["Automated in-app guidance and email programs triggered by usage data","A dedicated on-site CSM who attends the customer's weekly steering committee","A named executive sponsor who meets the customer's CIO every month in person","A custom-built success plan with a separate workshop for every department"],"a":[0],"e":"Tech-touch scales through automation and data-triggered content. Dedicated on-site coverage, executive meetings and bespoke workshops belong to high-touch models.","src":"guide","s":"3.5"},{"id":"S4-30","set":4,"d":3,"t":"A customer's weekly active users fall 35% in a month and the executive sponsor has stopped attending calls. What is the BEST response?","o":["Create a risk CTA with an owner and due date to reach the sponsor and find the cause","Wait to see whether the numbers recover by themselves before taking any action on the account","Send a general product announcement email to all users and monitor the open rate","Move the account to the next renewal forecast without further investigation"],"a":[0],"e":"Two strong risk signals call for a specific, owned, time-bound action. Waiting, a generic email or simply forecasting the renewal do not address the cause.","src":"general","s":"3.6"},{"id":"S4-31","set":4,"d":3,"t":"What should trigger an internal playbook for a low-adoption account?","o":["A defined condition, such as health dropping below a threshold or no logins for 30 days","Any time the CSM has free capacity and wants to try a new approach with the customer","Only a written complaint from the customer's executive team about the vendor","The calendar date of the vendor's quarterly board meeting each year"],"a":[0],"e":"Playbooks run on defined, data-based triggers so risk is caught early and handled consistently. Complaints arrive late, and capacity or board dates have nothing to do with account risk.","src":"general","s":"3.7"},{"id":"S4-32","set":4,"d":3,"t":"Why should a team review its health score thresholds regularly?","o":["To keep the score predictive by checking it against actual renewal and churn results","To make the average score of the whole portfolio look higher in executive reports","To reduce the number of data sources that the team needs to monitor every week","To match the thresholds other vendors use in the market without testing them first"],"a":[0],"e":"A health score is only useful if it predicts outcomes. Comparing scores with real renewal and churn data shows whether weights and bands still work. Inflating averages, cutting data sources or copying other vendors does not.","src":"general","s":"3.4"},{"id":"S4-33","set":4,"d":4,"t":"Which agenda item belongs in an onboarding kickoff with the customer?","o":["Confirm goals, success criteria, roles and the first milestone dates","Review the customer's financial results for the last five fiscal years","Present a detailed renewal quote for the next three-year term","Discuss the vendor's internal reorganization of its support teams"],"a":[0],"e":"A kickoff aligns on outcomes, ownership and early milestones so onboarding starts well. Financial history, renewal quotes and vendor reorganizations are not kickoff content.","src":"general","s":"4.1"},{"id":"S4-34","set":4,"d":4,"t":"Which check BEST confirms a customer is ready for renewal?","o":["Usage versus entitlement, open barriers and executive sponsor engagement are reviewed","The renewal quote has been generated and sent to the customer's procurement mailbox","The customer has not opened a support case in the last two weeks of the contract","The CSM has confirmed that the contract end date appears correctly in the CRM"],"a":[0],"e":"Renewal readiness is about value and risk: is the customer using what it bought, are barriers closed and is the sponsor engaged? A quote, a quiet fortnight or a CRM date do not show readiness.","src":"general","s":"4.1"},{"id":"S4-35","set":4,"d":4,"t":"What is the primary purpose of a Quarterly Success Review (QSR)?","o":["To review progress against the agreed goals and KPIs and to agree the next actions","To demonstrate every feature in the product that the customer has not yet purchased","To negotiate the price of the next contract term with the customer's finance team","To train new end users on the basic navigation of the product's interface"],"a":[0],"e":"A QSR is about outcomes: what was achieved, what blocks progress and what happens next. It is not a feature tour, a negotiation or a training session.","src":"general","s":"4.2"},{"id":"S4-36","set":4,"d":4,"t":"Which preparation step MOST improves a QSR?","o":["Share a short data-based pre-read so attendees arrive ready to decide quickly","Prepare a long product slide deck so the meeting fills the full scheduled time","Invite every employee at the customer so all opinions are heard at the meeting","Avoid sending any material in advance so the discussion stays spontaneous"],"a":[0],"e":"A pre-read with real data lets the meeting focus on decisions. Long decks, oversized invitations and no preparation waste time and weaken outcomes.","src":"general","s":"4.2"},{"id":"S4-37","set":4,"d":4,"t":"What should happen immediately after a QSR?","o":["Record agreed actions, owners and dates in the success plan and share them","Wait for the next quarter before writing anything down, to keep the notes consistent","Send the notes only to the vendor's internal sales team for forecasting purposes","Delete the pre-read so the data cannot be misused by anyone later"],"a":[0],"e":"Follow-up turns discussion into commitments. Recording owners and dates in the success plan keeps everyone accountable and keeps the plan current.","src":"general","s":"4.2"},{"id":"S4-38","set":4,"d":4,"t":"On a stakeholder grid, a person with HIGH influence and HIGH interest in the project should be handled how?","o":["Managed closely, with frequent engagement and involvement in key decisions","Monitored with minimal effort, since the person is unlikely to affect the outcome","Kept informed through a periodic general update, without involvement in decisions","Left off the success plan to avoid slowing down the team's work"],"a":[0],"e":"High influence plus high interest is the group that can most affect the outcome, so it is managed closely. Lower-influence groups can be kept informed or monitored.","src":"guide","s":"4.2"},{"id":"S4-39","set":4,"d":4,"t":"A CSM covers 400 low-touch customers and wants each one to receive guided next steps for its stage in the lifecycle. Which tooling does the exam blueprint link to digital guidance?","o":["Lifecycle Advantage (LCA), including LCA-CS","A printed binder of the product's configuration guides","A weekly in-person workshop at every customer site","A manual spreadsheet maintained by the vendor's finance team"],"a":[0],"e":"The blueprint names Lifecycle Advantage (LCA) and LCA-CS for digital guidance. At 400 accounts, scaled digital guidance is the only option that fits. Check Cisco's training for how each tool works.","src":"blueprint","s":"4.4"},{"id":"S4-40","set":4,"d":4,"t":"A customer on an Enterprise Agreement has used 30% of its entitlement with eighteen months left. Which tool does the blueprint name for tracking consumption, and what does the CSM do?","o":["EAWS; investigate the barrier and agree an adoption plan to raise consumption","EAWS; do nothing until the final month, when the numbers will correct themselves","PXP; cancel the agreement and ask the customer to buy individual products instead","LCA; issue a refund for the unused part of the entitlement straight away"],"a":[0],"e":"The blueprint names the Enterprise Agreement Workspace (EAWS) for tracking EA consumption. Low consumption with plenty of time left is exactly when the CSM should find the barrier and act. Confirm tool details in Cisco's training.","src":"blueprint","s":"4.5"},{"id":"S4-41","set":4,"d":4,"t":"What is the main benefit of organizing licenses into Virtual Accounts under a Smart Account?","o":["Teams or regions can manage their own licenses while the customer keeps a total view","Each Virtual Account has its own separate contract, price and renewal date with the vendor","Licenses expire automatically unless every Virtual Account is used on the same day","The vendor no longer needs to know which licenses the customer owns at all"],"a":[0],"e":"Virtual Accounts divide a Smart Account's licenses for local management and visibility while the Smart Account preserves the whole-customer picture. They do not create separate contracts.","src":"general","s":"4.6"},{"id":"S4-42","set":4,"d":4,"t":"Where does the 820-605 v3.0 blueprint place the Partner Experience Platform (PXP)?","o":["Under Customer Success Management and Tooling","Under Customer Success Industry and Foundations","Under Success Plan Creation and Value Realization","Under Barrier Management and Health Monitoring"],"a":[0],"e":"The blueprint lists PXP among the tools in the Customer Success Management and Tooling domain (4.3). For details of what it does, rely on Cisco's own training.","src":"blueprint","s":"4.3"},{"id":"S4-43","set":4,"d":5,"t":"A customer pays $15,000 per month under a three-year subscription. What is the total contract value (TCV)?","o":["$540,000","$180,000","$45,000","$1,620,000"],"a":[0],"e":"TCV = monthly payment x number of months = 15,000 x 36 = $540,000. $180,000 is the annual recurring revenue (one year) and $45,000 is a quarter.","src":"general","s":"5.1"},{"id":"S4-44","set":4,"d":5,"t":"A cohort starts the year at $2,000,000 ARR. It loses $100,000 to downgrades and $200,000 to cancellations, and adds $400,000 in expansion. What is gross revenue retention (GRR)?","o":["85%","105%","95%","90%"],"a":[0],"e":"GRR excludes expansion: (2,000,000 - 100,000 - 200,000) / 2,000,000 = 85%. 105% is net revenue retention (it includes expansion), while 95% and 90% ignore one of the losses.","src":"general","s":"5.1"},{"id":"S4-45","set":4,"d":5,"t":"What does time to value (TTV) measure?","o":["The time from purchase until the customer first reaches an agreed outcome","The time from first contact with the sales team until the contract is signed","The time between a support case being opened and the case being closed","The length of the contract term the customer agreed to when buying"],"a":[0],"e":"TTV tracks how quickly the customer reaches first measurable value after buying. It differs from sales cycle length, case resolution time and contract term.","src":"general","s":"5.1"},{"id":"S4-46","set":4,"d":5,"t":"In the learning guide's financial terms, what does Available to Renew (ATR) represent?","o":["The portion of contract value coming up for renewal in a given period","The amount a customer has already paid for the current term in full","The expected expansion revenue from new products in the pipeline","The total value of all unpaid invoices across the customer base"],"a":[0],"e":"ATR is the recurring value that is up for renewal in a period, which is why it frames renewal planning. Paid amounts, pipeline and unpaid invoices are different measures.","src":"guide","s":"5.1"},{"id":"S4-47","set":4,"d":5,"t":"A customer is consuming 92% of its licensed capacity and asks how to add more users. Which expansion signal is this?","o":["Usage","Maturity","Strategic pivot","Renewal risk"],"a":[0],"e":"Consumption nearing entitlement is a usage signal. Maturity is about readiness for advanced capability and a strategic pivot is a change in the customer's direction.","src":"blueprint","s":"5.3"},{"id":"S4-48","set":4,"d":5,"t":"A customer announces the acquisition of a competitor and will need to connect thousands of new employees. Which expansion signal is this?","o":["Strategic pivot","Usage","Maturity","Health decline"],"a":[0],"e":"A major change in business direction such as an acquisition creates new needs and is a strategic pivot signal. The CSM can map it to additional solutions.","src":"blueprint","s":"5.3"},{"id":"S4-49","set":4,"d":5,"t":"What should an expansion proposal lead with to be MOST persuasive?","o":["The business outcomes already achieved and the further value the new scope would unlock","The vendor's own revenue target for the quarter and the discount available to hit it","A complete list of the product's features, ranked by the vendor's profit margin","A reminder that the customer's current contract cannot be renewed without expanding"],"a":[0],"e":"Customers expand when they see proven value and a credible next step. Vendor targets, margin-ranked features and pressure tactics do not make the customer's case.","src":"general","s":"5.4"},{"id":"S4-50","set":4,"d":5,"t":"Which event is the strongest renewal-RISK signal?","o":["The executive sponsor leaves and no replacement has been named","The customer's team asks a detailed question about a feature in the product","The customer attends the vendor's annual user conference with six colleagues","The customer requests a copy of the latest product roadmap presentation"],"a":[0],"e":"Losing the executive sponsor removes the person who owns the value case and the budget, so it is a major risk signal. The other events show engagement and interest.","src":"general","s":"5.3"}];
var BY = {};
(window.EXTRA_Q || []).forEach(function (q, i) {
  if (!q || !q.t || !q.o || q.o.length < 2 || !q.a || !q.a.length || !(q.d >= 1 && q.d <= 5)) return;
  q.id = q.id || ("X-" + (i + 1)); q.set = 5; q.src = q.src || "general"; BANK.push(q);
});
BANK.forEach(function (q) { BY[q.id] = q; });
function setCount(n) { return BANK.filter(function (q) { return q.set === n; }).length; }

var K_PREF = "csm605-portal-pref-v1", K_HIST = "csm605-portal-hist-v1", K_OUT = "csm605-portal-outbox-v1", K_SESS = "csm605-portal-session-v1";
var app = document.getElementById("app");

function lsGet(k, def) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pad(n) { return (n < 10 ? "0" : "") + n; }
function fmt(ms) { var s = Math.max(0, Math.round(ms / 1000)); return pad(Math.floor(s / 60)) + ":" + pad(s % 60); }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function dstr(ts) { var d = new Date(ts); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- state ---------- */
var pref = lsGet(K_PREF, {});
pref.name = pref.name || "";
pref.url = pref.url || CONFIG.SCRIPT_URL;
pref.token = pref.token || CONFIG.TOKEN;
var hist = lsGet(K_HIST, []);
var outbox = lsGet(K_OUT, []);
var S = lsGet(K_SESS, null);
var view = "home", tick = null, filter = "all";
var remote = null, remoteState = "idle", syncMsg = "";

function savePref() { lsSet(K_PREF, pref); }
function configured() { return !!(pref.url && /^https:\/\//.test(pref.url)); }
function nameKey() { return (pref.name || "").trim().toLowerCase(); }

/* ---------- history and profile ---------- */
function add(map, key, ok) { var o = map[key] || (map[key] = { r: 0, n: 0 }); o.n++; if (ok) o.r++; }
function emptyP() { return { att: [], q: {}, d: {}, s: {} }; }
function addRec(P, a) {
  P.att.push({ ts: a.ts, id: a.id, set: a.label, mode: a.mode, score: a.right, total: a.n, used: a.used, doms: a.doms });
  a.ans.forEach(function (x) {
    var o = P.q[x.qid] || (P.q[x.qid] = { n: 0, r: 0, last: true });
    o.n++; if (x.ok) o.r++; o.last = x.ok;
    add(P.d, x.d, x.ok);
    if (x.s) add(P.s, x.s, x.ok);
  });
}
function localProfile() {
  var k = nameKey(), P = emptyP();
  hist.forEach(function (a) { if ((a.name || "").trim().toLowerCase() === k) addRec(P, a); });
  return P;
}
function profile() {
  if (!remote) return localProfile();
  var P = JSON.parse(JSON.stringify(remote));
  var k = nameKey();
  var seen = {}; P.att.forEach(function (a) { seen[a.id] = 1; });
  outbox.forEach(function (a) { if ((a.name || "").trim().toLowerCase() === k && !seen[a.id]) addRec(P, a); });
  return P;
}
function pct(o) { return o && o.n ? Math.round(o.r / o.n * 100) : null; }

/* ---------- sync with Google Apps Script ---------- */
function payload(a) {
  return {
    token: pref.token || "", participant: a.name, examSet: a.label, mode: a.mode, attemptId: a.id,
    score: a.right, total: a.n, timeUsedSec: a.used, domains: a.doms,
    answers: a.ans.map(function (x) { return { qid: x.qid, domain: x.d, sub: x.s, selected: x.sel, correct: x.cor, isCorrect: x.ok, flagged: x.flag, timeSec: x.sec }; })
  };
}
function post(a) {
  return fetch(pref.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload(a)) })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || "rejected"); return j; });
}
var flushing = false;
function flush() {
  if (!configured() || !outbox.length || flushing) { setSync(); return Promise.resolve(); }
  flushing = true; syncMsg = "Sending " + outbox.length + " attempt(s)...";
  setSync();
  var chain = Promise.resolve();
  outbox.slice().forEach(function (a) {
    chain = chain.then(function () {
      return post(a).then(function () {
        outbox = outbox.filter(function (x) { return x.id !== a.id; }); lsSet(K_OUT, outbox);
      });
    });
  });
  return chain.then(function () { syncMsg = "Saved to Google Sheet"; }).catch(function (e) {
    syncMsg = "Not saved yet (" + (e && e.message ? e.message : "network") + "). Will retry.";
  }).then(function () { flushing = false; setSync(); });
}
function fetchRemote() {
  if (!configured() || !nameKey()) { remote = null; remoteState = "idle"; return Promise.resolve(); }
  remoteState = "loading";
  var u = pref.url + (pref.url.indexOf("?") > -1 ? "&" : "?") + "action=profile&participant=" + encodeURIComponent(pref.name.trim()) + "&token=" + encodeURIComponent(pref.token || "");
  return fetch(u).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || "rejected");
    remote = { att: j.attempts || [], q: j.q || {}, d: j.d || {}, s: j.s || {} };
    remoteState = "ok";
  }).catch(function () { remote = null; remoteState = "fail"; }).then(function () { if (view === "home" || view === "history") render(); });
}
function setSync() {
  var el = document.getElementById("sync");
  if (el) { el.textContent = syncMsg; el.className = "pill " + (/^Saved/.test(syncMsg) ? "ok" : /^Not/.test(syncMsg) ? "bad" : "warn"); el.style.display = syncMsg ? "" : "none"; }
}

/* ---------- question selection ---------- */
function isCorrect(it) {
  var a = BY[it.id].a;
  return it.sel.length === a.length && a.every(function (x) { return it.sel.indexOf(x) > -1; });
}
function nAnswered() { return S.items.filter(function (i) { return i.sel.length > 0; }).length; }

function rankBy(P, mode, weakSubs) {
  return function (q) {
    var st = P.q[q.id], r = Math.random(), base;
    if (mode === "mock") base = !st ? 0 : (st.last ? (st.r < st.n ? 1 : 2) : 1);
    else {
      if (!st) base = 2;
      else if (!st.last) base = 0;
      else if (st.r < st.n) base = 1;
      else base = 3;
      if (weakSubs && q.s && weakSubs[q.s] && base > 1) base = 1.5;
    }
    return base + r * 0.9;
  };
}
function takeSorted(pool, n, rank) {
  return pool.map(function (q) { return { q: q, k: rank(q) }; }).sort(function (a, b) { return a.k - b.k; }).slice(0, n).map(function (x) { return x.q; });
}
function weakDomains(P) {
  return Object.keys(DOMAINS).map(function (d) { var o = P.d[d]; return { d: +d, p: o && o.n ? o.r / o.n : 0.5, n: o ? o.n : 0 }; })
    .sort(function (a, b) { return a.p - b.p; });
}
function weakSubMap(P) {
  var m = {};
  Object.keys(P.s).forEach(function (k) { var o = P.s[k]; if (o.n >= 2 && o.r / o.n < 0.7) m[k] = 1; });
  return m;
}
function mockPool(d) {
  var fresh = BANK.filter(function (q) { return q.d === d && !USED[q.set]; });
  return fresh.length >= MIX[d] ? fresh : BANK.filter(function (q) { return q.d === d; });
}
function build(mode, arg) {
  var P = profile(), ids = [], label = "";
  if (mode === "set") {
    ids = BANK.filter(function (q) { return q.set === +arg; }).map(function (q) { return q.id; });
    label = SETS[arg].replace(/,.*$/, "");
  } else if (mode === "mock") {
    var rk = rankBy(P, "mock", null);
    Object.keys(MIX).forEach(function (d) {
      takeSorted(mockPool(+d), MIX[d], rk).forEach(function (q) { ids.push(q.id); });
    });
    label = "Full mock";
  } else if (mode === "weak") {
    var wd = weakDomains(P).slice(0, 2).map(function (x) { return x.d; });
    var pool = BANK.filter(function (q) { return wd.indexOf(q.d) > -1; });
    ids = takeSorted(pool, 25, rankBy(P, "weak", weakSubMap(P))).map(function (q) { return q.id; });
    label = "Weak-area practice (D" + wd.join(", D") + ")";
  } else if (mode === "misses") {
    var pool2 = BANK.filter(function (q) { var st = P.q[q.id]; return st && (!st.last || st.r < st.n); });
    ids = takeSorted(pool2, 30, rankBy(P, "weak", null)).map(function (q) { return q.id; });
    label = "Retry my misses";
  } else if (mode === "drill") {
    var pool3 = BANK.filter(function (q) { return q.d === +arg; });
    ids = takeSorted(pool3, 15, rankBy(P, "weak", weakSubMap(P))).map(function (q) { return q.id; });
    label = "Domain drill D" + arg;
  }
  return { ids: ids, label: label };
}
function missCount() {
  var P = profile(), c = 0;
  BANK.forEach(function (q) { var st = P.q[q.id]; if (st && (!st.last || st.r < st.n)) c++; });
  return c;
}

function startExam(mode, arg) {
  if (!pref.name.trim()) { view = "home"; render(); var f = document.getElementById("nm"); if (f) { f.classList.add("err"); f.focus(); } return; }
  var b = build(mode, arg);
  if (!b.ids.length) { syncMsg = ""; alert_("No questions available for this mode yet."); return; }
  var order = mode === "set" ? shuffle(b.ids) : shuffle(b.ids);
  var now = Date.now();
  S = { id: uid(), name: pref.name.trim(), mode: mode, label: b.label, startedAt: now, deadline: now + order.length * PER_Q, mark: now, cur: 0,
        items: order.map(function (id) { return { id: id, perm: shuffle(BY[id].o.map(function (_, i) { return i; })), sel: [], flag: false, sec: 0 }; }),
        done: false, endedAt: null, confirm: false };
  filter = "all"; view = "exam"; lsSet(K_SESS, S); render(); window.scrollTo(0, 0);
}
function alert_(msg) { var el = document.getElementById("msg"); if (el) el.textContent = msg; }

function touch() {
  if (!S || S.done) return;
  var now = Date.now(), it = S.items[S.cur];
  if (it && S.mark) it.sec = (it.sec || 0) + Math.min(300, Math.round((now - S.mark) / 1000));
  S.mark = now;
}
function saveS() { lsSet(K_SESS, S); }

function finish() {
  touch();
  S.done = true; S.confirm = false; S.endedAt = Math.min(Date.now(), S.deadline);
  var doms = {};
  Object.keys(DOMAINS).forEach(function (k) { doms[k] = { r: 0, n: 0 }; });
