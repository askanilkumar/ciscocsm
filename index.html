  var ans = S.items.map(function (it) {
    var q = BY[it.id], ok = isCorrect(it);
    doms[q.d].n++; if (ok) doms[q.d].r++;
    var sel = it.sel.slice().sort(function (a, b) { return a - b; }).map(function (i) { return L[i]; }).join("|");
    return { qid: q.id, d: q.d, s: q.s || "", sel: sel, cor: q.a.map(function (i) { return L[i]; }).join("|"), ok: ok, flag: it.flag, sec: it.sec || 0 };
  });
  var right = ans.filter(function (x) { return x.ok; }).length;
  var rec = { id: S.id, name: S.name, label: S.label, mode: S.mode, ts: S.endedAt, n: S.items.length, right: right, used: Math.round((S.endedAt - S.startedAt) / 1000), doms: doms, ans: ans };
  S.recId = rec.id;
  hist.push(rec); lsSet(K_HIST, hist);
  outbox.push(rec); lsSet(K_OUT, outbox);
  saveS();
  syncMsg = configured() ? "Sending..." : "Not saved to the Sheet: add the Apps Script URL in Settings";
  view = "results"; render(); window.scrollTo(0, 0);
  flush().then(function () { if (configured()) fetchRemote(); });
}

/* ---------- screens ---------- */
function topbar(active) {
  var tabs = [["home", "Practice"], ["history", "History and weak areas"], ["settings", "Settings"]]
    .map(function (t) { return "<button class='" + (active === t[0] ? "on" : "") + "' data-act='nav' data-v='" + t[0] + "'>" + t[1] + "</button>"; }).join("");
  return "<header class='bar'><div class='bar-in'><div class='brand'>820-605 CSM<small>Exam portal</small></div><nav class='topnav'>" + tabs + "</nav><div class='spacer'></div>" +
    "<span id='sync' class='pill' style='display:none'></span></div></header>";
}
function domBars(P, showN) {
  return Object.keys(DOMAINS).map(function (k) {
    var o = P.d[k], p = o && o.n ? Math.round(o.r / o.n * 100) : 0;
    return "<div class='dom'><div>" + k + ". " + esc(DOMAINS[k]) + " <small>(" + WEIGHTS[k] + "%)</small></div><div class='barbox'><i class='" + (o && o.n && p < PASS ? "low" : "") + "' style='width:" + p + "%'></i></div><div class='mono' style='text-align:right'>" + (o && o.n ? p + "%" : "-") + "</div></div>";
  }).join("");
}

function home() {
  var P = profile(), att = P.att.slice().sort(function (a, b) { return a.ts - b.ts; });
  var done = att.length, best = 0, sum = 0;
  att.forEach(function (a) { var p = a.total ? a.score / a.total * 100 : 0; sum += p; if (p > best) best = p; });
  var seen = Object.keys(P.q).length, miss = missCount();
  var wd = weakDomains(P);
  var weakTxt = P.att.length ? "Targets D" + wd[0].d + " and D" + wd[1].d + ", your lowest domains, using questions you missed first." : "Takes your two lowest domains once you have history. Until then it samples any two.";
  var drillOpts = Object.keys(DOMAINS).map(function (d) { return "<option value='" + d + "'>D" + d + " " + esc(DOMAINS[d]) + "</option>"; }).join("");
  var setBtns = [1, 2, 3, 4, 5].filter(function (s) { return setCount(s) > 0; }).map(function (s) { return "<button class='btn ghost' data-act='start' data-m='set' data-a='" + s + "'>" + esc(SETS[s].replace(/,.*$/, "")) + " (" + setCount(s) + ")" + (USED[s] ? " · taken" : "") + "</button>"; }).join("");
  var remoteNote = !configured() ? "Results are stored only in this browser. Add the Apps Script URL in Settings to save them to the Google Sheet."
    : remoteState === "loading" ? "Loading your history from the Sheet..." : remoteState === "fail" ? "Could not read history from the Sheet. Showing this browser's history." : "History is read from the Google Sheet.";

  app.innerHTML = topbar("home") +
    "<section class='page'><div><div class='eyebrow'>Cisco Customer Success Manager</div><h1 style='margin-top:8px'>Practice, track, improve</h1></div>" +

    "<div class='panel'><div class='field'><label for='nm'>Participant name</label><input id='nm' class='input' value='" + esc(pref.name) + "' placeholder='Enter your name' autocomplete='name' data-act='name'>" +
    "<span class='note' id='msg'>Use the same name each time, so your history stays together. " + remoteNote + "</span></div></div>" +
    "<div class='facts'><div class='fact'><b>" + done + "</b><span>attempts</span></div><div class='fact'><b>" + (done ? Math.round(best) + "%" : "-") + "</b><span>best score</span></div><div class='fact'><b>" + (done ? Math.round(sum / done) + "%" : "-") + "</b><span>average</span></div><div class='fact'><b>" + seen + "/" + BANK.length + "</b><span>questions seen</span></div></div>" +
    "<div class='modes'>" +
    "<div class='mode'><h3>Full mock exam</h3><p>50 questions in the blueprint mix (8, 12, 12, 10, 8 across the five domains), 75 minutes. Draws from questions not used in Sets 1 and 2, and prefers ones you have not seen.</p><div class='row'><button class='btn' data-act='start' data-m='mock'>Start mock</button></div></div>" +
    "<div class='mode'><h3>Weak-area practice</h3><p>" + esc(weakTxt) + " 25 questions.</p><div class='row'><button class='btn' data-act='start' data-m='weak'>Start practice</button></div></div>" +
    "<div class='mode'><h3>Retry my misses</h3><p>" + (miss ? miss + " question(s) you got wrong last time or at some point. Up to 30 per round." : "Nothing to retry yet. Misses appear here after your first attempt.") + "</p><div class='row'><button class='btn' data-act='start' data-m='misses'" + (miss ? "" : " disabled") + ">Retry misses</button></div></div>" +

    "<div class='mode'><h3>Fixed sets</h3><p>Full sets, in random order each time. Sets 3 and 4 are built from the Cisco learning guide and the v3.0 blueprint. Sets 1 and 2 were already taken, so mocks skip them.</p><div class='row'>" + setBtns + "</div></div>" +
    "</div>" +
    "<div class='panel'><h2>Accuracy by domain</h2>" + domBars(P) + "<p class='note' style='margin:10px 0 0'>Amber bars are below " + PASS + "%. Weights are the official 820-605 v3.0 blueprint weights.</p></div>" +
    "<div class='panel'><h2>How it works</h2><ul class='plain'><li>Questions and options are shuffled on every attempt. <b>Choose 2</b> or <b>Choose 3</b> questions are correct only if every selected answer is right.</li>" +

function settings() {

    "<section class='page'><h1>Settings</h1>" +
    "<div class='panel'><h2>Google Sheet connection</h2><div class='field'><label for='su'>Apps Script web app URL</label><input id='su' class='input mono' value='" + esc(pref.url) + "' placeholder='https://script.google.com/macros/s/.../exec'></div>" +
    "<div class='field' style='margin-top:12px'><label for='st'>Token (optional)</label><input id='st' class='input mono' value='" + esc(pref.token) + "' placeholder='Same value as the TOKEN script property' autocomplete='off'></div>" +
    "<div class='row' style='margin-top:16px'><button class='btn' data-act='savecfg'>Save</button><button class='btn ghost' data-act='test'>Test connection</button><button class='btn ghost' data-act='syncnow'>Send unsent attempts (" + outbox.length + ")</button></div>" +
    "<p class='note' id='cfgmsg' style='margin:12px 0 0'>The URL ends in /exec. Anyone who has this page also has the token, so treat it as a light guard, not as a password.</p></div>" +
    "<div class='panel'><h2>On this device</h2><p class='note' style='margin:0 0 12px'>" + hist.length + " attempt(s) stored in this browser. " + outbox.length + " waiting to be sent.</p>" +
    "<div class='row'><button class='btn ghost' data-act='export'>Show attempts as JSON</button></div><pre id='exp' class='mono note' style='white-space:pre-wrap;overflow-wrap:anywhere;display:none;max-height:260px;overflow:auto'></pre></div></section>";
  setSync();
}

function trendSvg(att) {
  var a = att.slice(-20), W = 560, H = 190, l = 36, r = 12, t = 12, b = 26;
  if (!a.length) return "<p class='note'>No attempts yet.</p>";
  function x(i) { return l + (a.length === 1 ? (W - l - r) / 2 : i * (W - l - r) / (a.length - 1)); }
  function y(p) { return t + (100 - p) / 100 * (H - t - b); }
  var pts = a.map(function (z, i) { return x(i) + "," + y(z.total ? z.score / z.total * 100 : 0); }).join(" ");
  var dots = a.map(function (z, i) { return "<circle class='dot' cx='" + x(i) + "' cy='" + y(z.total ? z.score / z.total * 100 : 0) + "' r='4'><title>" + esc(dstr(z.ts) + " " + (z.set || "") + ": " + Math.round(z.total ? z.score / z.total * 100 : 0) + "%") + "</title></circle>"; }).join("");
  return "<svg class='trend' viewBox='0 0 " + W + " " + H + "' role='img' aria-label='Score trend over the last " + a.length + " attempts'>" +
    [0, 50, 100].map(function (p) { return "<line class='ax' x1='" + l + "' x2='" + (W - r) + "' y1='" + y(p) + "' y2='" + y(p) + "'/><text x='" + (l - 6) + "' y='" + (y(p) + 4) + "' text-anchor='end'>" + p + "</text>"; }).join("") +
    "<line class='tgt' x1='" + l + "' x2='" + (W - r) + "' y1='" + y(PASS) + "' y2='" + y(PASS) + "'/><text x='" + (W - r) + "' y='" + (y(PASS) - 4) + "' text-anchor='end'>target " + PASS + "</text>" +
    "<polyline class='ln' points='" + pts + "'/>" + dots + "</svg>";
}

function historyView() {
  var P = profile(), att = P.att.slice().sort(function (a, b) { return a.ts - b.ts; });
  var rows = att.slice().reverse().slice(0, 25).map(function (a) {
    var p = a.total ? Math.round(a.score / a.total * 100) : 0;
    return "<tr><td class='mono'>" + esc(dstr(a.ts)) + "</td><td>" + esc(a.set || "") + "</td><td class='n'>" + a.score + "/" + a.total + "</td><td class='n'>" + p + "%</td><td class='n'>" + fmt((a.used || 0) * 1000) + "</td></tr>";
  }).join("") || "<tr><td colspan='5' class='note'>No attempts yet.</td></tr>";
  var subs = Object.keys(P.s).map(function (k) { var o = P.s[k]; return { k: k, r: o.r, n: o.n, p: o.r / o.n }; }).filter(function (x) { return x.n >= 1; })
    .sort(function (a, b) { return a.p - b.p || b.n - a.n; }).slice(0, 10);
  var subRows = subs.map(function (x) { return "<tr><td class='mono'>" + x.k + "</td><td>" + esc(SUBS[x.k] || "") + "</td><td class='n'>" + x.r + "/" + x.n + "</td><td class='n'>" + Math.round(x.p * 100) + "%</td></tr>"; }).join("") ||
    "<tr><td colspan='4' class='note'>Sub-topic data appears after you answer tagged questions (Set 3 and the mixed modes).</td></tr>";
  var qs = Object.keys(P.q).filter(function (id) { return BY[id] && P.q[id].r < P.q[id].n; })
    .sort(function (a, b) { return (P.q[b].n - P.q[b].r) - (P.q[a].n - P.q[a].r) || (P.q[a].last ? 1 : 0) - (P.q[b].last ? 1 : 0); }).slice(0, 12);
  var qRows = qs.map(function (id) {
    var q = BY[id], o = P.q[id];
    return "<tr><td class='mono'>" + esc(id) + "</td><td>" + esc(q.t) + "</td><td class='n'>" + (o.n - o.r) + " of " + o.n + "</td></tr>";
  }).join("") || "<tr><td colspan='3' class='note'>No missed questions yet.</td></tr>";
  var wd = weakDomains(P);
  var focus = att.length ? "Focus next on D" + wd[0].d + " (" + esc(DOMAINS[wd[0].d]) + ")" + (wd[1] ? " and D" + wd[1].d : "") + "." : "Take a mock exam to start building your profile.";
  app.innerHTML = topbar("history") +
    "<section class='page'><h1>History and weak areas</h1><p class='lede'>" + focus + " " + esc(pref.name ? "Participant: " + pref.name.trim() + "." : "Enter a name on the Practice screen first.") + "</p>" +
    "<div class='row'><button class='btn' data-act='start' data-m='weak'>Practice weak areas</button><button class='btn ghost' data-act='start' data-m='misses'" + (missCount() ? "" : " disabled") + ">Retry my misses</button><button class='btn ghost' data-act='refresh'>Refresh from Sheet</button></div>" +
    "<div class='two'><div class='panel'><h2>Score trend</h2>" + trendSvg(att) + "</div><div class='panel'><h2>Accuracy by domain</h2>" + domBars(P) + "</div></div>" +
    "<div class='panel'><h2>Weakest sub-topics</h2><div class='tscroll'><table><thead><tr><th>ID</th><th>Sub-topic</th><th class='n'>Correct</th><th class='n'>Accuracy</th></tr></thead><tbody>" + subRows + "</tbody></table></div></div>" +
    "<div class='panel'><h2>Most-missed questions</h2><div class='tscroll'><table><thead><tr><th>ID</th><th>Question</th><th class='n'>Missed</th></tr></thead><tbody>" + qRows + "</tbody></table></div></div>" +
    "<div class='panel'><h2>Recent attempts</h2><div class='tscroll'><table><thead><tr><th>When</th><th>Exam</th><th class='n'>Score</th><th class='n'>Percent</th><th class='n'>Time</th></tr></thead><tbody>" + rows + "</tbody></table></div></div></section>";
  setSync();
}

function exam() {
  var it = S.items[S.cur], q = BY[it.id], multi = q.a.length > 1, n = S.items.length, ans = nAnswered();
  var head = "<header class='bar'><div class='bar-in'><div class='brand'>820-605 CSM<small>" + esc(S.label) + "</small></div><div class='spacer'></div>" +
    "<div class='count'>Answered " + ans + " of " + n + "</div><div id='timer' class='timer'>" + fmt(S.deadline - Date.now()) + "</div></div>" +
    "<div class='prog'><i style='width:" + Math.round(ans / n * 100) + "%'></i></div></header>";
  var main;
  if (S.confirm) {
    var un = n - ans, fl = S.items.filter(function (i) { return i.flag; }).length;
    main = "<section class='qcard confirm'><h2>Submit your exam?</h2><p>Once submitted, you cannot change your answers. The attempt is logged for your history.</p>" +
      "<div class='stats3'><div><b>" + ans + "</b>answered</div><div><b>" + un + "</b>unanswered</div><div><b>" + fl + "</b>flagged</div></div>" +
      "<div class='row'><button class='btn danger' data-act='yes'>Submit and see results</button><button class='btn ghost' data-act='no'>Back to questions</button></div></section>";
  } else {
    var opts = it.perm.map(function (oi, pos) {
      var on = it.sel.indexOf(oi) > -1;
      return "<li><label class='opt" + (on ? " on" : "") + "'><input id='o" + oi + "' type='" + (multi ? "checkbox" : "radio") + "' name='q' data-act='pick' data-i='" + oi + "'" + (on ? " checked" : "") + ">" +
        "<span class='letter'>" + L[pos] + "</span><span class='txt'>" + esc(q.o[oi]) + "</span></label></li>";
    }).join("");
    var last = S.cur === n - 1;
    main = "<section class='qcard'><div class='qmeta'><span class='mono'>Question " + (S.cur + 1) + " / " + n + "</span>" +
      (multi ? "<span class='tag multi'>Choose " + q.a.length + "</span>" : "") + (it.flag ? "<span class='tag'>Flagged</span>" : "") + "</div>" +
      "<p class='qtext'>" + esc(q.t) + "</p><ul class='opts'>" + opts + "</ul>" +
      "<div class='qfoot'><button class='btn ghost' data-act='prev'" + (S.cur === 0 ? " disabled" : "") + ">Previous</button>" +
      "<button class='btn ghost' data-act='flag'>" + (it.flag ? "Remove flag" : "Flag for review") + "</button><span class='spacer'></span>" +
      (last ? "<button class='btn' data-act='finish'>Review and submit</button>" : "<button class='btn' data-act='next'>Next</button>") + "</div></section>";
  }
  var nav = S.items.map(function (x, i) {
    var c = (x.sel.length ? " ans" : "") + (x.flag ? " flag" : "") + (i === S.cur ? " cur" : "");
    return "<button class='" + c.trim() + "' data-act='go' data-i='" + i + "' aria-label='Question " + (i + 1) + (x.sel.length ? ", answered" : "") + (x.flag ? ", flagged" : "") + "'>" + (i + 1) + "</button>";
  }).join("");
  var side = "<aside class='map'><h2>Question map</h2><div class='nav'>" + nav + "</div>" +
    "<div class='legend'><span><i class='a'></i>Answered</span><span><i class='f'></i>Flagged</span></div><button class='btn' style='width:100%' data-act='finish'>Finish exam</button></aside>";
  app.innerHTML = head + "<div class='grid'>" + main + side + "</div>";
  updateTimer(); clearInterval(tick); tick = setInterval(updateTimer, 1000);
}
function updateTimer() {
  if (!S || S.done || view !== "exam") return;
  var left = S.deadline - Date.now();
  if (left <= 0) { clearInterval(tick); finish(); return; }
  var el = document.getElementById("timer");
  if (!el) return;
  el.textContent = fmt(left);
  el.className = "timer" + (left < 5 * 60000 ? " crit" : left < 10 * 60000 ? " warn" : "");
}

function results() {
  clearInterval(tick);
  var n = S.items.length, right = 0, none = 0, dt = {};
  Object.keys(DOMAINS).forEach(function (k) { dt[k] = { r: 0, n: 0 }; });
  S.items.forEach(function (it) {
    var d = BY[it.id].d; dt[d].n++;
    if (!it.sel.length) none++;
    if (isCorrect(it)) { right++; dt[d].r++; }
  });
  var p = Math.round(right / n * 1000) / 10, pass = p >= PASS, used = (S.endedAt || S.deadline) - S.startedAt;
  var doms = Object.keys(DOMAINS).filter(function (k) { return dt[k].n; }).map(function (k) {
    var q = Math.round(dt[k].r / dt[k].n * 100);
    return "<div class='dom'><div>" + k + ". " + esc(DOMAINS[k]) + " <small>(" + WEIGHTS[k] + "%)</small></div><div class='barbox'><i class='" + (q < PASS ? "low" : "") + "' style='width:" + q + "%'></i></div><div class='mono' style='text-align:right'>" + dt[k].r + "/" + dt[k].n + "</div></div>";
  }).join("");
  var counts = { all: n, wrong: n - right - none, none: none, flag: S.items.filter(function (i) { return i.flag; }).length };
  var chips = [["all", "All (" + counts.all + ")"], ["wrong", "Incorrect (" + counts.wrong + ")"], ["none", "Unanswered (" + counts.none + ")"], ["flag", "Flagged (" + counts.flag + ")"]]
    .map(function (c) { return "<button class='chip" + (filter === c[0] ? " on" : "") + "' data-act='filter' data-f='" + c[0] + "'>" + c[1] + "</button>"; }).join("");
  var cards = S.items.map(function (it, idx) {
    var q = BY[it.id], ok = isCorrect(it), blank = !it.sel.length;
    if (filter === "wrong" && (ok || blank)) return "";
    if (filter === "none" && !blank) return "";
    if (filter === "flag" && !it.flag) return "";
    var cls = ok ? "c" : blank ? "u" : "w", st = ok ? "Correct" : blank ? "Unanswered" : "Incorrect";
    var opts = it.perm.map(function (oi, pos) {
      var isAns = q.a.indexOf(oi) > -1, picked = it.sel.indexOf(oi) > -1;
      var c = isAns ? " ok" : picked ? " bad" : "";
      var lab = isAns && picked ? "Your answer, correct" : isAns ? "Correct answer" : picked ? "Your answer" : "";
      return "<li class='ropt" + c + "'><span class='mono'>" + L[pos] + "</span><span class='txt'>" + esc(q.o[oi]) + "</span>" + (lab ? "<span class='lab'>" + lab + "</span>" : "") + "</li>";
    }).join("");
    return "<li><article class='card " + cls + "'><div class='qmeta'><span class='status'>" + st + "</span><span class='mono'>Q" + (idx + 1) + "</span><span class='tag'>Domain " + q.d + "</span>" +
      (q.s ? "<span class='tag'>" + q.s + " " + esc(SUBS[q.s] || "") + "</span>" : "") +
      (q.a.length > 1 ? "<span class='tag multi'>Choose " + q.a.length + "</span>" : "") + (it.flag ? "<span class='tag'>Flagged</span>" : "") + "<span class='tag'>" + esc(SRC[q.src] || "") + "</span><span class='tag'>" + esc(q.id) + "</span></div>" +
      "<p class='qtext' style='font-size:18px'>" + esc(q.t) + "</p><ul class='ropts'>" + opts + "</ul><div class='why'><b>Why</b>" + esc(q.e) + "</div></article></li>";
  }).join("") || "<li class='panel note'>No questions match this filter.</li>";
  app.innerHTML = topbar("") +
    "<section class='page'><div class='hero'><div class='score'>" + p + "%</div><div><span class='verdict " + (pass ? "pass" : "fail") + "'>" + (pass ? "At or above the " + PASS + "% target" : "Below the " + PASS + "% target") + "</span>" +
    "<div style='font-size:20px;font-weight:600'>" + right + " of " + n + " correct</div><div class='note'>" + esc(S.label) + " · time used " + fmt(used) + " of " + fmt(n * PER_Q) + (none ? " · " + none + " unanswered" : "") + "</div></div></div>" +
    "<div class='panel'><h2>Score by domain</h2>" + doms + "<p class='note' style='margin:10px 0 0'>Amber bars are below " + PASS + "%. Revisit those domains first.</p></div>" +
    "<div class='row'><button class='btn' data-act='start' data-m='weak'>Practice weak areas</button><button class='btn ghost' data-act='start' data-m='misses'>Retry my misses</button><button class='btn ghost' data-act='nav' data-v='history'>See history</button><button class='btn ghost' data-act='nav' data-v='home'>Back to home</button></div>" +
    "<div><h2 style='margin:0 0 10px;font-size:20px'>Review answers</h2><div class='chips'>" + chips + "</div></div><ol class='rev'>" + cards + "</ol></section>";
  setSync();
}

function render() {
  clearInterval(tick);
  if (S && !S.done && view === "exam") return exam();
  if (S && S.done && view === "results") return results();
  if (view === "settings") return settings();
  if (view === "history") return historyView();
  view = "home"; home();
}

/* ---------- events ---------- */
app.addEventListener("click", function (e) {
  var t = e.target.closest("[data-act]");
  if (!t || t.tagName === "INPUT" || t.tagName === "SELECT") return;
  var act = t.getAttribute("data-act");
  var live = S && !S.done && view === "exam";
  if (live) touch();
  if (act === "nav") {
    if (live) { saveS(); }
    view = t.getAttribute("data-v"); if (view === "history" || view === "home") { fetchRemote(); } render(); window.scrollTo(0, 0); return;
  }
  if (act === "start") {
    if (live && !confirmLeave()) return;
    return startExam(t.getAttribute("data-m"), t.getAttribute("data-a"));
  }
  if (act === "drill") { var sel = document.getElementById("drill"); return startExam("drill", sel ? sel.value : 1); }
  if (act === "refresh") { remoteState = "loading"; return fetchRemote(); }
  if (act === "savecfg") {
    pref.url = document.getElementById("su").value.trim(); pref.token = document.getElementById("st").value.trim(); savePref();
    var m = document.getElementById("cfgmsg"); if (m) m.textContent = configured() ? "Saved." : "Saved, but the URL must start with https://";
    flush(); return;
  }
  if (act === "syncnow") { pref.url = document.getElementById("su").value.trim(); pref.token = document.getElementById("st").value.trim(); savePref(); flush().then(function () { var m = document.getElementById("cfgmsg"); if (m) m.textContent = outbox.length ? "Still " + outbox.length + " unsent. " + syncMsg : "All attempts are sent."; }); return; }
  if (act === "test") {
    pref.url = document.getElementById("su").value.trim(); pref.token = document.getElementById("st").value.trim(); savePref();
    var m2 = document.getElementById("cfgmsg"); if (m2) m2.textContent = "Testing...";
    if (!configured()) { if (m2) m2.textContent = "Enter the https URL first."; return; }
    fetch(pref.url + (pref.url.indexOf("?") > -1 ? "&" : "?") + "action=ping&token=" + encodeURIComponent(pref.token || "")).then(function (r) { return r.json(); })
      .then(function (j) { if (m2) m2.textContent = j.ok ? "Connected to the Sheet (" + (j.sheet || "ok") + ")." : "Reached the script, but it said: " + j.error; })
      .catch(function () { if (m2) m2.textContent = "Could not reach the script. Check the URL and that access is set to Anyone."; });
    return;
  }
  if (act === "export") { var pre = document.getElementById("exp"); if (pre) { pre.style.display = "block"; pre.textContent = JSON.stringify(hist, null, 1); } return; }
  if (act === "filter") { filter = t.getAttribute("data-f"); return results(); }
  if (!S || S.done) return;
  if (act === "prev" && S.cur > 0) { S.cur--; }
  else if (act === "next" && S.cur < S.items.length - 1) { S.cur++; }
  else if (act === "go") { S.cur = +t.getAttribute("data-i"); S.confirm = false; }
  else if (act === "flag") { S.items[S.cur].flag = !S.items[S.cur].flag; saveS(); return exam(); }
  else if (act === "finish") { S.confirm = true; saveS(); exam(); window.scrollTo(0, 0); return; }
  else if (act === "no") { S.confirm = false; }
  else if (act === "yes") { return finish(); }
  else { return; }
  saveS(); exam(); window.scrollTo(0, 0);
});
function confirmLeave() { return true; }
app.addEventListener("input", function (e) {
  var t = e.target;
  if (t && t.getAttribute("data-act") === "name") { pref.name = t.value; savePref(); t.classList.remove("err"); remote = null; }
});
app.addEventListener("change", function (e) {
  var t = e.target;
  if (t && t.getAttribute("data-act") === "name") { fetchRemote(); return; }
  if (!t || t.getAttribute("data-act") !== "pick" || !S || S.done) return;
  touch();
  var it = S.items[S.cur], need = BY[it.id].a.length, oi = +t.getAttribute("data-i");
  if (need > 1) {
    var k = it.sel.indexOf(oi);
    if (k > -1) it.sel.splice(k, 1); else { it.sel.push(oi); if (it.sel.length > need) it.sel.shift(); }
  } else { it.sel = [oi]; }
  saveS(); exam();
  var f = document.getElementById("o" + oi); if (f) f.focus();
});

/* ---------- boot ---------- */
if (S && !S.done) {
  if (Date.now() >= S.deadline) { finish(); }
  else { view = "exam"; }
} else if (S && S.done) { S = null; lsDel(K_SESS); }
render();
if (view === "home") { flush(); fetchRemote(); }
})();
</script>

</body>
</html>
